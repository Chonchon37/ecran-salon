<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Accueil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECE3; --card:#F6F7F2; --card2:#DEE4D7; --ink:#1E2A23; --muted:#5E6B62; --line:#CBD3C4;
  --accent:#587A57; --on-ink:#F6F7F2; --p2:#94679A; --nous:#2F6FB8; --fete:#C98622; --fete-soft:#F4E4C6;
  --sun:#D8962A; --moon:#9AA6BF; --cloud:#B4BFBA; --rain:#3B74A6; --rain-soft:#D3E2EE;
  --ok:#4C8758; --warn:#BC6430; --warn-soft:#F2DCCB; --tram:#BD074E; --bus:#004488; --badge-ink:#FFFFFF;
}
html.nuit{
  --bg:#0F151C; --card:#18212A; --card2:#222D38; --ink:#E3E8E1; --muted:#8E9B95; --line:#2B3743;
  --accent:#92B28E; --on-ink:#0F151C; --p2:#C49BCB; --nous:#6EA6E6; --fete:#E0A847; --fete-soft:#33280F;
  --sun:#E6AE48; --moon:#D8D0A4; --cloud:#5A6977; --rain:#6EA5D5; --rain-soft:#1C3246;
  --ok:#7CBA87; --warn:#E38A52; --warn-soft:#3A2619; --tram:#D0326A; --bus:#2F6FB0; --badge-ink:#FFFFFF;
}
html,body{margin:0;width:1280px;height:728px;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:Figtree,Roboto,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color .8s,color .8s}
.h{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif}
[hidden]{display:none!important}
.demo{font-size:12px;letter-spacing:.06em;padding:3px 9px;border-radius:20px;background:var(--warn-soft);color:var(--warn);font-weight:700;text-transform:uppercase;display:inline-block;vertical-align:middle}

/* Grille de tuiles : 4 colonnes ; les rangées se partagent la hauteur.
   Chaque tuile occupe « l » colonnes et « h » rangées (réglable dans la page admin). */
.grille{box-sizing:border-box;width:1280px;height:728px;padding:24px 36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);grid-auto-flow:row dense;grid-gap:16px}
.tuile{background:var(--card);border-radius:20px;box-sizing:border-box;padding:20px 24px;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column;transition:background-color .8s}
.tuile.nu{background:transparent;padding:6px 4px}
.lien{cursor:pointer;transition:transform .15s}
.lien:active{-webkit-transform:scale(.985);transform:scale(.985)}
.vide{font-size:19px;color:var(--muted);margin-top:12px}
.plus{font-size:16px;font-weight:700;color:var(--muted);margin-top:8px}

/* Date */
.greet{font-size:46px;font-weight:600;line-height:1;letter-spacing:-.02em}
.l2 .greet,.l3 .greet,.l4 .greet{font-size:68px}
.date{font-size:26px;font-weight:500;margin-top:10px}
.l2 .date,.l3 .date,.l4 .date{font-size:30px}
.date-meteo{display:flex;align-items:center;margin-top:8px;flex:none}
.date-meteo span{font-size:34px;font-weight:600;margin-left:6px;letter-spacing:-.02em}
.date-meteo small{font-size:18px;color:var(--muted);margin-left:12px}
.demi .date-meteo{margin-top:2px}
.demi .date-meteo svg{width:30px;height:30px}
.demi .date-meteo span{font-size:24px}
.msg{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:12px;background:var(--fete-soft);color:var(--fete);font-size:20px;font-weight:700;line-height:1.3;align-self:flex-start}

/* Météo */
.wx-corps{display:flex;flex-direction:column;flex:1;min-height:0}
.wx-large .wx-corps{flex-direction:row}
.wx-gauche{display:flex;flex-direction:column;flex:none}
.wx-large .wx-gauche{margin-right:28px;max-width:46%}
.wx-large .wx-temp{font-size:84px}
.wx-droite{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.wx-main{display:flex;align-items:center}
.wx-temp{font-size:100px;font-weight:600;line-height:1;letter-spacing:-.03em;margin-left:6px}
.petit .wx-temp{font-size:72px}
.wx-hl{font-size:19px;color:var(--muted);margin-top:4px}
.alert{display:flex;align-items:center;margin-top:14px;padding:10px 14px;border-radius:14px;background:var(--rain-soft);color:var(--rain);font-size:18px;font-weight:700;line-height:1.25}
.alert svg{width:24px;height:24px;margin-right:10px;flex:none}
.alert.sec{background:var(--card2);color:var(--muted)}
.vigi{display:flex;align-items:center;border-radius:12px;font-weight:700;margin-top:14px;font-size:18px;padding:9px 14px;line-height:1.25}
.vigi svg{width:22px;height:22px;margin-right:9px;flex:none}
.vigi.jaune{background:#F5D33C;color:#3B3000}
.vigi.orange{background:#EE8323;color:#2B1400}
.vigi.rouge{background:#D42F2F;color:#FFFFFF}
.mini{margin-top:auto;border-top:2px solid var(--line);padding-top:10px}
.wx-large .mini{margin-top:0;border-top:0;padding-top:0}
.mini-t{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mini-h{display:flex}
.mh{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.mh-t{font-size:16px;font-weight:600;color:var(--muted)}
.mh-v{font-size:21px;font-weight:600}
.wx-haut{display:flex;align-items:center;flex:none}
.wx-haut.compact .wx-temp{font-size:80px}
.wx-cote{flex:1;min-width:0;margin-left:28px;display:flex;flex-direction:column;justify-content:center}
.wx-cote .alert,.wx-cote .vigi{margin-top:10px}
.wx-puces{display:flex;flex-wrap:wrap;margin:-4px}
.wx-puces span{margin:4px;padding:7px 12px;border-radius:12px;background:var(--card2);font-size:17px;font-weight:600;white-space:nowrap}
.wx-puces b{color:var(--muted);font-weight:600;margin-right:3px}
/* Grande tuile météo */
.wg-haut{display:flex;align-items:center;flex:none}
.wg-temp{display:flex;align-items:center;flex:none}
.wg-temp span{font-size:92px;font-weight:600;line-height:1;letter-spacing:-.03em;margin-left:4px}
.wx-grande.h1 .wg-temp span{font-size:74px}
.wg-info{margin-left:26px;min-width:0}
.wg-lib{font-size:28px;font-weight:600;line-height:1.1}
.wg-det{font-size:18px;color:var(--muted);margin-top:5px;line-height:1.3}
.wg-det b{color:var(--ink)}
.wg-pluie{flex:none}
.wg-pluie .alert{margin-top:12px}
.wx-grande .vigi{flex:none;margin-top:12px}
.wg-titre{flex:none;margin-top:14px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wg-courbe{flex:1;min-height:0;margin-top:4px;overflow:hidden}
.wg-courbe svg{display:block}
.wg-jours{flex:none;display:flex;margin:10px -5px 0}
.wg-j{flex:1;min-width:0;margin:0 5px;padding:6px 10px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.wg-j svg{margin:0 6px;flex:none}
.wg-jn{font-size:17px;font-weight:700}
.wg-jt{font-size:18px;color:var(--muted)}
.wg-jt b{color:var(--ink)}
.wg-jp{font-size:15px;font-weight:700;color:var(--rain);margin-left:6px}
.wg-jp:empty{display:none}
.jours-p{border-top:2px solid var(--line);margin-top:12px;padding-top:8px}
.jp{display:flex;align-items:center;font-size:19px;line-height:1.9}
.jp-n{width:70px;font-weight:600}
.jp-i{width:40px;display:flex;align-items:center}
.jp-t{margin-left:auto;color:var(--muted)}
.jp-t b{color:var(--ink)}

/* Transports */
.tr > :first-child,.bd > :first-child{margin-top:auto}
.tr > :last-child,.bd > :last-child{margin-bottom:auto}
.tl{display:flex;align-items:center}
.tl + .tl{margin-top:14px}
.badge{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:27px;font-weight:700;color:var(--badge-ink);margin-right:14px;flex:none}
.badge.tram{background:var(--tram);border-radius:50%}
.badge.bus{background:var(--bus);border-radius:11px}
.tl-txt{flex:1;min-width:0}
.tl-s{font-size:21px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-d{font-size:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-m{margin-left:12px;text-align:right;flex:none}
.l1 .tl-m{margin-left:auto}
.tl-m b{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:46px;font-weight:600;line-height:1;letter-spacing:-.02em}
.tl-n{font-size:16px;color:var(--ok);font-weight:700;white-space:nowrap}
.tl-n.vite{color:var(--warn)}
.tl-puis{font-size:16px;color:var(--muted);white-space:nowrap;margin-top:2px}

/* Anniversaires */

.bd-q{font-size:30px;font-weight:600;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-j{font-size:20px;font-weight:700;color:var(--fete);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-d{font-size:17px;color:var(--muted);font-weight:400}
.bd-q,.bd-j{flex:none}
/* la liste rétrécit (et se coupe en bas) plutôt que de pousser le nom du haut hors de la tuile */
.bd-suite{margin-top:10px;border-top:1.5px solid var(--line);padding-top:6px;flex:0 1 auto;min-height:0;overflow:hidden}
.bd-l{display:flex;align-items:baseline;font-size:18px;line-height:1.55}
.bd-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bd-w{color:var(--muted);margin-left:10px;white-space:nowrap}

/* Agenda */
.ag-cols{flex:1;display:flex;min-height:0}
.ag-col{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column}
.ag-col + .ag-col{margin-left:22px;padding-left:22px;border-left:2px solid var(--line)}
.ev-sub{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none}
.ag-bloc{flex:none}
.ag-bloc + .ag-bloc .ev-sub{margin-top:16px}
.ev{display:flex;align-items:center;margin-top:12px;flex:none}
.ev-h{width:86px;font-size:20px;font-weight:700;flex:none}
.ev i{width:12px;height:12px;border-radius:50%;margin-right:14px;flex:none}
.ev-n{font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* Maison */
.home-s{font-size:19px;font-weight:600;flex:none}
.sc{display:flex;flex-wrap:wrap;align-content:stretch;margin:-5px;min-height:0}
.l1 .scene{font-size:18px}
.scene{box-sizing:border-box;height:72px;min-height:52px;margin:5px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px;font-weight:600;padding:0 10px;white-space:nowrap;overflow:hidden;transition:background-color .3s,color .3s}
.scene svg{width:26px;height:26px;margin-right:9px;flex:none}
.scene span{overflow:hidden;text-overflow:ellipsis}
.scene.on{background:var(--accent);color:var(--on-ink)}
/* Demi-rangée */
.tuile.demi{padding:14px 22px}
.demi > :first-child{margin-top:auto}
.demi > :last-child{margin-bottom:auto}
.wx-ligne{display:flex;align-items:center}
.wx-demi .wx-temp{font-size:56px;margin:0 16px 0 8px}
.wx-demi .wx-hl{margin:0 16px 0 0;font-size:20px}
.wx-pl{flex:1;min-width:0}
.wx-pl .alert{margin-top:0}
.tr-demi{flex-direction:row !important;flex-wrap:wrap;align-items:center}
.tr-demi .tl{flex:1;min-width:200px}
.tr-demi .tl + .tl{margin-top:0;margin-left:20px}
.tr-demi .tl > :first-child{margin-top:0}
.tr-demi .tl-m b{font-size:38px}
.maison-demi{flex-direction:row !important;align-items:center}
.maison-demi > .home-s,.maison-demi > .sc{margin-top:0 !important;margin-bottom:0 !important}
.maison-demi .home-s{width:150px;font-size:17px;line-height:1.25}
.maison-demi .sc{flex:1;flex-wrap:nowrap;margin:-5px;align-self:stretch}
.maison-demi .scene{height:64px}
.demi .greet{font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-demi .tl-m{text-align:left;margin-left:14px}
.bd-ligne{display:flex;flex-wrap:wrap;align-items:baseline;overflow:hidden;max-height:44px;line-height:40px}
.bd-c{font-size:22px;margin-right:26px;white-space:nowrap}
.bd-c b{font-weight:600}
.bd-c .bd-j{font-size:19px;display:inline}
.demi .date{font-size:20px;margin-top:4px}
.demi .ev{margin-top:6px}
.lums{display:flex;flex-wrap:wrap;margin:14px -4px 0;flex:none}
.lum{margin:4px;padding:9px 14px;border-radius:12px;background:var(--card2);font-size:17px;font-weight:600;cursor:pointer;white-space:nowrap}
.lum.on{background:var(--fete-soft);color:var(--fete)}
</style>
</head>
<body>
<div class="grille" id="grille"></div>

<script>
/* ===================== RÉGLAGES ===================== */
var CONFIG = {
  // Sans clé (?cle=… dans l'adresse), agenda, maison et anniversaires restent en exemple
  METEO_REELLE: true,     // météo réelle via Open-Meteo (gratuit, sans clé)
  WORKER_TRANSPORTS: 'https://ecran-salon.nico-michon37.workers.dev/transports',
  WORKER: 'https://ecran-salon.nico-michon37.workers.dev',
  LAT: 47.418, LON: 0.688
};
// Disposition par défaut (modifiable dans la page admin) : ordre, largeur l (1-4 colonnes), hauteur h (1-3 rangées)
var DISPOSITION = [
  { id: 'date', l: 1, h: 1 }, { id: 'transports', l: 2, h: 1 }, { id: 'anniversaires', l: 1, h: 1 },
  { id: 'meteo', l: 1, h: 2 }, { id: 'agenda', l: 3, h: 1.5 }, { id: 'maison', l: 3, h: 0.5 }
];
/* ==================================================== */

function param(n){ var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function themeAuto(){ var h = new Date().getHours(); return (h >= 19 || h < 7) ? 'nuit' : 'jour'; }
function appliquerTheme(t){ if (!t || t === 'auto') t = themeAuto(); document.documentElement.className = t === 'nuit' ? 'nuit' : ''; }
appliquerTheme(param('theme'));
window.addEventListener('message', function(e){ if (e.data && e.data.type === 'theme') appliquerTheme(e.data.value); });
function signalerToucher(){ if (window.parent !== window) { try { window.parent.postMessage({ type: 'interaction' }, '*'); } catch (err) {} } }
document.addEventListener('touchstart', signalerToucher, true);
document.addEventListener('mousedown', signalerToucher, true);
function $(id){ return document.getElementById(id); }
var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
var JOURS_C = ['Dim.', 'Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.'];
var MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function majuscule(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function hhmm(ms){ var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function echapper(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* ---------- Icônes météo (identiques à meteo.html) ---------- */
function iSoleil(cx, cy, r, r1, r2){
  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="var(--sun)"/>';
  for (var a = 0; a < 8; a++) {
    var ang = a * Math.PI / 4, c = Math.cos(ang), si = Math.sin(ang);
    s += '<line x1="' + (cx + c * r1).toFixed(1) + '" y1="' + (cy + si * r1).toFixed(1) + '" x2="' + (cx + c * r2).toFixed(1) + '" y2="' + (cy + si * r2).toFixed(1) + '" stroke="var(--sun)" stroke-width="3.2" stroke-linecap="round"/>';
  }
  return s;
}
function iLune(){ return '<path d="M38 14a18 18 0 1 0 12 30A15 15 0 0 1 38 14z" fill="var(--moon)"/>'; }
function iNuage(){ return '<path d="M19 50h28a11 11 0 0 0 1.5-21.9A15 15 0 0 0 20 31a9.5 9.5 0 0 0-1 19z" fill="var(--cloud)"/>'; }
function iGouttes(n){
  var xs = n === 2 ? [27, 39] : [23, 33, 43], s = '';
  for (var k = 0; k < xs.length; k++) s += '<path d="M' + xs[k] + ' 49l-3 8" stroke="var(--rain)" stroke-width="3.6" stroke-linecap="round"/>';
  return s;
}
function iconeMeteo(code, jour, taille){
  var c = code, s = '<svg width="' + taille + '" height="' + taille + '" viewBox="0 0 64 64">';
  var haut = '<g transform="translate(0,-7)">' + iNuage() + '</g>';
  var petitAstre = jour ? iSoleil(22, 20, 8, 12, 16) : '<g transform="translate(-2,-7) scale(.7)">' + iLune() + '</g>';
  if (c === 0) s += jour ? iSoleil(32, 32, 11, 16, 22) : iLune();
  else if (c === 1 || c === 2) s += petitAstre + '<g transform="translate(4,6)">' + iNuage() + '</g>';
  else if (c === 3) s += iNuage();
  else if (c === 45 || c === 48) s += '<g stroke="var(--cloud)" stroke-width="4" stroke-linecap="round"><path d="M14 24h36M10 33h44M14 42h36M20 51h24"/></g>';
  else if (c >= 95) s += haut + '<path d="M34 43l-8 11h6l-3 8 10-12h-6l3-7z" fill="var(--sun)"/>';
  else if ((c >= 71 && c <= 77) || c === 85 || c === 86) s += haut + '<g fill="var(--rain)"><circle cx="24" cy="52" r="2.6"/><circle cx="33" cy="57" r="2.6"/><circle cx="42" cy="52" r="2.6"/></g>';
  else if (c >= 80 && c <= 82) s += (jour ? iSoleil(20, 15, 7, 10.5, 14) : '') + haut + iGouttes(3);
  else if (c >= 51 && c <= 57) s += haut + iGouttes(2);
  else if (c >= 61) s += haut + iGouttes(3);
  else s += iNuage();
  return s + '</svg>';
}

/* ---------- Données d'exemple (sans clé) ---------- */
function mockTemp(h){ return Math.round(12.5 + 3.5 * Math.cos((h - 15) / 24 * 2 * Math.PI)); }
function mockCode(h){
  if (h === 20 || h === 21) return 80; if (h === 22) return 61;
  if (h >= 23 || h <= 2) return 3; if (h <= 8) return 2; if (h <= 11) return 1; if (h <= 16) return 2; return 3;
}
function jourA(h){ return h >= 9 && h < 19; }
var t0 = Date.now();
var LIGNES = [
  { ligne: 'A', type: 'tram', arret: 'Monconseil', direction: 'Jean Monnet', marche: 7, passages: [3.6, 11.2, 19.4, 27.0] },
  { ligne: '2', type: 'bus', arret: 'Maréchal Juin', direction: 'CHU Trousseau', marche: 9, passages: [7.3, 21.5, 35.2, 49.0] }
];
var DEMO_AG = [
  { j: 0, debut: '08:30', titre: 'Point d\'équipe', qui: 'moi' },
  { j: 0, debut: '20:30', titre: 'Cinéma avec Flo', qui: 'flo' },
  { j: 1, debut: '12:30', titre: 'Déjeuner avec Marc', qui: 'moi' },
  { j: 1, debut: '18:30', titre: 'Yoga Flo', qui: 'flo' },
  { j: 2, debut: '19:00', titre: 'Apéro chez Cam', qui: 'nous' }
];
var COULEURS = { moi: 'var(--accent)', flo: 'var(--p2)', nous: 'var(--nous)' };
var DEMO_ANNIV = [{ nom: 'Lucie', jour: 22, mois: 10, annee: 1995 }, { nom: 'Papa', jour: 3, mois: 11, annee: 1962 }, { nom: 'Julien', jour: 14, mois: 11, annee: 1990 }, { nom: 'Mamie', jour: 28, mois: 11, annee: 1940 }];
var DEMO_LUM = [{ id: 'l1', nom: 'Salon', allumee: true }, { id: 'l2', nom: 'Cuisine', allumee: true }, { id: 'l3', nom: 'Bureau', allumee: false }, { id: 'l4', nom: 'Entrée', allumee: true }];
var DEMO_SCENES = [{ id: 'soiree', nom: 'Soirée' }, { id: 'film', nom: 'Film' }, { id: 'diner', nom: 'Dîner' }, { id: 'eteindre', nom: 'Tout éteindre' }];
var sceneActive = 'soiree';

/* ---------- Chargement des données ---------- */
var CLE = param('cle');
function prive(){ return !!(CONFIG.WORKER && CLE); }
function lireJson(url, quandOk){
  var xhr = new XMLHttpRequest();

/* ---------- Tuile Transports ---------- */
function passagesLigne(L){
  var res = [];
  if (transportsReels) {
    var PR = transportsReels.lignes[L.ligne] ? transportsReels.lignes[L.ligne].passages : [];
    for (var q = 0; q < PR.length; q++) { var mq = Math.floor((PR[q].t - Date.now()) / 60000); if (mq >= L.marche) res.push({ min: mq, t: PR[q].t }); }
  } else {
    for (var p = 0; p < L.passages.length; p++) {
      var tt = t0 + L.passages[p] * 60000, m = Math.floor((tt - Date.now()) / 60000);
      if (m >= L.marche) res.push({ min: m, t: tt });
    }
    if (!res.length) { t0 = Date.now(); return passagesLigne(L); }
  }
  return res;
}
function prochainPassage(){
  var mini = 9999;
  for (var k = 0; k < LIGNES.length; k++) if (LIGNES[k].actif !== false) { var P = passagesLigne(LIGNES[k]); if (P.length) mini = Math.min(mini, P[0].min); }
  return mini;
}
function tuileTransports(T, now, l, h){

    if (!P.length) {

      if (pro) { var dp = new Date(pro), demainP = dp.getDate() !== now.getDate(); txt = (L.type === 'tram' ? 'Premier tram ' : 'Premier bus ') + (demainP ? 'demain ' : '') + 'à ' + hhmm(pro); }
      html += '<div class="tl">' + badge + '<div class="tl-txt">' + (avecNoms ? '<div class="tl-s">' + L.arret + '</div>' : '') + '<div class="tl-d" style="white-space:normal">' + txt + '</div></div></div>';
      continue;

    if (avecSuite && P.length > 1) suite = '<div class="tl-puis">puis ' + P.slice(1, 3).map(function(x){ return hhmm(x.t); }).join(' · ') + '</div>';

/* ---------- Tuile Anniversaires ---------- */
function anniversaires(now, horizonJours){
  var auj = new Date(now.getFullYear(), now.getMonth(), now.getDate()), AN = [];
  if (agendaReel && agendaReel.anniversaires) {
    for (var b = 0; b < agendaReel.anniversaires.length; b++) {
      var x = agendaReel.anniversaires[b], dx = new Date(x.date), dj = new Date(dx.getFullYear(), dx.getMonth(), dx.getDate());
      if (dj >= auj && dj - auj <= horizonJours * 86400000) AN.push({ nom: x.nom, date: dj, age: x.annee ? dj.getFullYear() - x.annee : 0 });
    }
  } else if (!prive()) {
    for (var dm = 0; dm < DEMO_ANNIV.length; dm++) {
      var Dd = DEMO_ANNIV[dm], dA = new Date(auj.getFullYear(), Dd.mois - 1, Dd.jour);
      if (dA < auj) dA = new Date(auj.getFullYear() + 1, Dd.mois - 1, Dd.jour);
      if (dA - auj <= horizonJours * 86400000) AN.push({ nom: Dd.nom, date: dA, age: dA.getFullYear() - Dd.annee });
    }
    AN.sort(function(p, q){ return p.date - q.date; });
  }
  return { liste: AN, auj: auj };
}

/* ---------- Tuile Agenda ---------- */
function tuileAgenda(T, now, l, h){
  T.className += ' ag lien'; T.setAttribute('data-page', 'agenda');
  var hr = now.getHours(), minNow = hr * 60 + now.getMinutes(), NBJ = 14, jours = [], d;
  for (d = 0; d < NBJ; d++) jours.push([]);
  var j0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  function debutJour(k){ return new Date(now.getFullYear(), now.getMonth(), now.getDate() + k).getTime(); }
  if (agendaReel && agendaReel.evenements) {
    for (var e = 0; e < agendaReel.evenements.length; e++) {
      var E = agendaReel.evenements[e], dd = new Date(E.debut);
      for (d = 0; d < NBJ; d++) {
        var a = debutJour(d), b = debutJour(d + 1);
        if (E.debut >= b || E.fin <= a) continue;                        // ne touche pas ce jour
        if (d === 0 && E.fin <= now.getTime()) continue;                  // déjà terminé aujourd'hui
        if (d > 0 && !E.journee && E.debut < a) continue;                 // événement à l'heure : seulement le jour où il commence
        jours[d].push({ debut: (E.journee || E.debut < a) ? null : pad(dd.getHours()) + ':' + pad(dd.getMinutes()), titre: E.titre, qui: quiPour(E) });
      }
    }
  } else if (!prive()) {
    for (var e2 = 0; e2 < DEMO_AG.length; e2++) {
      var ev = DEMO_AG[e2];
      if (ev.j === 0 && enMinutes(ev.debut) + 30 < minNow) continue;
      jours[ev.j].push(ev);
    }
  }
  // Jours affichés : aujourd'hui puis les jours suivants qui ont quelque chose (le soir, demain d'abord)
  function nomJour(k){
    if (k === 0) return demainDabord(now) && hr >= 12 ? 'Ce soir' : 'Aujourd\'hui';
    if (k === 1) return 'Demain';
    var x = new Date(debutJour(k));
    return majuscule(JOURS[x.getDay()]) + ' ' + x.getDate() + (k >= 7 ? ' ' + MOIS_C[x.getMonth()] : '');
  }
  var ordre = [];
  for (d = 0; d < NBJ; d++) ordre.push(d);
  if (demainDabord(now) && hr >= 12) { ordre[0] = 1; ordre[1] = 0; }
  // Blocs à placer : l'en-tête d'un jour reste collé à son premier événement
  var blocs = [];
  for (var o = 0; o < ordre.length; o++) {
    var k = ordre[o], L = jours[k];
    if (!L.length && k > 1) continue;
    var tete = '<div class="ev-sub">' + nomJour(k) + '</div>';
    if (!L.length) { blocs.push(tete + '<div class="vide">' + (prive() && !agendaReel ? 'Chargement…' : (k === 0 ? 'Plus rien de prévu' : 'Rien de prévu')) + '</div>'); continue; }
    L.sort(function(p, q){ return (p.debut || '00:00') < (q.debut || '00:00') ? -1 : 1; });
    for (var r = 0; r < L.length; r++) {
      var x = L[r], ligne = '<div class="ev"><div class="ev-h">' + (x.debut ? x.debut.replace(':', ' h ') : 'Journée') + '</div><i style="background:' + (COULEURS[x.qui] || COULEURS.moi) + '"></i><div class="ev-n">' + echapper(x.titre) + '</div></div>';
      blocs.push(r === 0 ? tete + ligne : ligne);
    }
  }
  // Remplissage des colonnes les unes après les autres, comme un journal
  var nb = Math.min(3, l), html = '<div class="ag-cols">';
  for (var c = 0; c < nb; c++) html += '<div class="ag-col"></div>';
  T.innerHTML = html + '</div>';
  var cols = T.querySelectorAll('.ag-col'), ci = 0, restants = 0;
  for (var z = 0; z < blocs.length; z++) {
    if (ci >= cols.length) { restants++; continue; }
    var div = document.createElement('div'); div.className = 'ag-bloc'; div.innerHTML = blocs[z];
    cols[ci].appendChild(div);
    if (deborde(cols[ci])) {
      cols[ci].removeChild(div);
      ci++;
      if (ci >= cols.length) { restants++; continue; }
      // en haut d'une nouvelle colonne, on rappelle le jour si le bloc n'a pas d'en-tête
      if (blocs[z].indexOf('ev-sub') < 0) {
        for (var y = z - 1; y >= 0; y--) { var m = /<div class="ev-sub">([^<]*)<\/div>/.exec(blocs[y]); if (m) { div.innerHTML = '<div class="ev-sub">' + m[1] + ' (suite)</div>' + blocs[z]; break; } }
      }
      cols[ci].appendChild(div);
      if (deborde(cols[ci])) { cols[ci].removeChild(div); ci = cols.length; restants++; }
    }
  }
  if (restants) {
    var der = cols[cols.length - 1], plus = document.createElement('div'); plus.className = 'plus'; plus.innerHTML = '+ ' + restants + ' autre' + (restants > 1 ? 's' : '');
    der.appendChild(plus);
    while (deborde(der) && der.childNodes.length > 1) { der.removeChild(der.childNodes[der.childNodes.length - 2]); restants++; plus.innerHTML = '+ ' + restants + ' autres'; }
  }
}

/* ---------- Mise en page ---------- */
// Placement des tuiles sur 4 colonnes × 3 rangées (on place d'abord toutes les tuiles réglées) :
// 1) chaque tuile prend la première place libre (si elle ne tient pas, on la rétrécit avant d'ajouter une rangée) ;
function placer(liste, masquee){
  // Tout se compte en demi-rangées : 6 demi-rangées = les 3 rangées de l'écran
  var R = 6, i, r, c, x, y;
  for (var essai = 0; essai < 14; essai++) {
    var occ = [], res = [], ok = true;
    for (r = 0; r < R; r++) occ.push([false, false, false, false]);
    var libre = function(r0, c0, w, h){
      if (c0 + w > 4 || r0 + h > R) return false;
      for (y = r0; y < r0 + h; y++) for (x = c0; x < c0 + w; x++) if (occ[y][x]) return false;
      return true;
    };
    for (i = 0; i < liste.length && ok; i++) {
      var t = liste[i], place = null, H = Math.max(1, Math.round(t.h * 2));
      for (var w = Math.min(4, t.l); w >= 1 && !place; w--) {
        for (var h = Math.min(R, H); h >= 1 && !place; h--) {
          if (w < t.l && h < H) continue;          // on ne rétrécit que dans un sens à la fois
          for (r = 0; r < R && !place; r++) for (c = 0; c < 4 && !place; c++) if (libre(r, c, w, h)) place = { r: r, c: c, w: w, h: h };
        }
      }
      if (!place) { ok = false; break; }
      for (y = place.r; y < place.r + place.h; y++) for (x = place.c; x < place.c + place.w; x++) occ[y][x] = true;
      res.push({ t: t, r: place.r, c: place.c, w: place.w, h: place.h });
    }
    if (!ok) { R++; continue; }
    // Tuiles masquées (moment de la journée) : les autres gardent leur place, le vide reste
    if (masquee) {
      var gardees = [];
      for (r = 0; r < R; r++) occ[r] = [false, false, false, false];
      for (i = 0; i < res.length; i++) if (!masquee(res[i].t)) {
        gardees.push(res[i]);
        for (y = res[i].r; y < res[i].r + res[i].h; y++) for (x = res[i].c; x < res[i].c + res[i].w; x++) occ[y][x] = true;
      }
      res = gardees;
    }
    // Pas d'étirement : les cases vides restent vides, c'est l'utilisateur qui règle les tailles
    return { rangees: R, places: res };
  }
  return { rangees: R, places: [] };
}

var VISIBLES = {};
var FABRIQUES = { date: tuileDate, meteo: tuileMeteo, transports: tuileTransports, anniversaires: tuileAnniversaires, agenda: tuileAgenda, maison: tuileMaison };
function afficher(){
  var now = new Date(), G = $('grille'), html = '', visibles = [];
  var A = null;
  for (var i = 0; i < DISPOSITION.length; i++) {
    var D = DISPOSITION[i];
    if (!FABRIQUES[D.id] || !tuileVisible(D.id, now)) continue;
    if (D.id === 'anniversaires') {
      A = anniversaires(now, D.h >= 2 ? 60 : 30);
      if (!A.liste.length && (!prive() || agendaReel)) continue;
    }
    visibles.push(D);
  }
  VISIBLES = {}; for (var vz = 0; vz < visibles.length; vz++) VISIBLES[visibles[vz].id] = true;
  var P = placer(DISPOSITION, function(t){ return visibles.indexOf(t) < 0; });
  for (var k = 0; k < P.places.length; k++) {
    var V = P.places[k];
    // classes : l1-l4 (colonnes), h1-h3 (rangées entières), demi (demi-rangée)
    var hr = V.h / 2, classeH = V.h === 1 ? ' demi' : ' h' + Math.max(1, Math.floor(hr));
    html += '<div class="tuile l' + V.w + classeH + '" id="t-' + V.t.id + '" style="grid-column:' + (V.c + 1) + ' / span ' + V.w + ';grid-row:' + (V.r + 1) + ' / span ' + V.h + '"></div>';
  }
  G.innerHTML = html;
  G.style.gridTemplateRows = 'repeat(' + P.rangees + ', minmax(0, 1fr))';
  for (var m = 0; m < P.places.length; m++) {
    var W = P.places[m], T = $('t-' + W.t.id);
    try { FABRIQUES[W.t.id](T, now, W.w, W.h / 2, A); } catch (err) { T.innerHTML = '<div class="vide">Indisponible</div>'; }
  }
}

// Toucher une tuile ouvre la page détaillée correspondante (sauf boutons de la maison)
document.addEventListener('click', function(e){
  var el = e.target;
  while (el && el !== document.body) {
    if (el.getAttribute && (el.getAttribute('data-scene') !== null || el.getAttribute('data-lum') !== null)) return;
    if (el.getAttribute && el.getAttribute('data-page')) {
      if (window.parent !== window) { try { window.parent.postMessage({ type: 'aller', page: el.getAttribute('data-page') }, '*'); } catch (err) {} }
      return;
    }
    el = el.parentNode;
  }
});

// Réglages envoyés par l'écran (page admin)
window.addEventListener('message', function(e){
  if (!e.data || e.data.type !== 'reglages' || !e.data.value) return;
  var g = e.data.value, k;
  if (g.transports) for (k = 0; k < LIGNES.length; k++) { var t = g.transports[LIGNES[k].ligne]; if (t) { LIGNES[k].marche = t.marche; LIGNES[k].actif = t.actif; } }
  if (g.agenda) { for (k in g.agenda.agendas) AGENDAS[k] = g.agenda.agendas[k]; }
  MESSAGE = g.message || '';
  if (g.accueil && g.accueil.moments) MOMENTS = g.accueil.moments;
  if (g.accueil && g.accueil.disposition && g.accueil.disposition.length) DISPOSITION = g.accueil.disposition;
  afficher();
});

afficher();
chargerMeteo(); setInterval(chargerMeteo, 15 * 60000);
chargerTransports(); setInterval(chargerTransports, 30000);
chargerAgenda(); setInterval(chargerAgenda, 5 * 60000);
chargerMaison(); setInterval(chargerMaison, 30000);
chargerVigi(); setInterval(chargerVigi, 5 * 60000);
setInterval(afficher, 20000);
// Une fois les polices chargées, les textes changent de taille : on recalcule ce qui tient
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ afficher(); });
</script>
