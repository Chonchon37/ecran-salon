<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Accueil</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECE3; --card:#F6F7F2; --card2:#DEE4D7; --ink:#1E2A23; --muted:#5E6B62; --line:#CBD3C4;
  --accent:#587A57; --on-ink:#F6F7F2; --p2:#94679A; --nous:#C98622; --fete:#C98622; --fete-soft:#F4E4C6;
  --sun:#D8962A; --moon:#9AA6BF; --cloud:#B4BFBA; --rain:#3B74A6; --rain-soft:#D3E2EE;
  --ok:#4C8758; --warn:#BC6430; --warn-soft:#F2DCCB; --tram:#B8325A; --bus:#2F6DB5; --badge-ink:#FFFFFF;
}
html.nuit{
  --bg:#0F151C; --card:#18212A; --card2:#222D38; --ink:#E3E8E1; --muted:#8E9B95; --line:#2B3743;
  --accent:#92B28E; --on-ink:#0F151C; --p2:#C49BCB; --nous:#E0A847; --fete:#E0A847; --fete-soft:#33280F;
  --sun:#E6AE48; --moon:#D8D0A4; --cloud:#5A6977; --rain:#6EA5D5; --rain-soft:#1C3246;
  --ok:#7CBA87; --warn:#E38A52; --warn-soft:#3A2619; --tram:#C9476D; --bus:#4683CB; --badge-ink:#FFFFFF;
}
html,body{margin:0;width:1280px;height:728px;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:Figtree,Roboto,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color .8s,color .8s}
.h{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif}
.wrap{box-sizing:border-box;width:1280px;height:728px;padding:24px 36px;display:flex}
.card{background:var(--card);border-radius:20px;box-sizing:border-box;padding:20px 24px;transition:background-color .8s}
.label{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.demo{font-size:12px;letter-spacing:.06em;padding:3px 9px;border-radius:20px;background:var(--warn-soft);color:var(--warn);font-weight:700;text-transform:uppercase;display:inline-block}

/* Colonne gauche : bonjour + météo */
.left{width:450px;margin-right:16px;display:flex;flex-direction:column}
.hello{padding:6px 4px 20px}
.greet{font-size:68px;font-weight:600;line-height:1;letter-spacing:-.02em}
.date{font-size:30px;font-weight:500;margin-top:10px}
.fete{font-size:19px;color:var(--muted);margin-top:8px;display:flex;align-items:center}
.fete .demo{margin-left:10px}
.wx{flex:1;display:flex;flex-direction:column}
.wx-main{display:flex;align-items:center;margin-top:6px}
.wx-temp{font-size:100px;font-weight:600;line-height:1;letter-spacing:-.03em;margin-left:6px}
.wx-cond{font-size:26px;font-weight:600}
.wx-hl{font-size:19px;color:var(--muted);margin-top:4px}
.alert{display:flex;align-items:center;margin-top:16px;padding:11px 14px;border-radius:14px;background:var(--rain-soft);color:var(--rain);font-size:19px;font-weight:700}
.alert svg{width:24px;height:24px;margin-right:10px;flex:none}
.alert.sec{background:var(--card2);color:var(--muted)}
.mini-h{display:flex;margin-top:auto;border-top:2px solid var(--line);padding-top:12px}
.mh{flex:1;display:flex;flex-direction:column;align-items:center}
.mh-t{font-size:16px;font-weight:600;color:var(--muted)}
.mh-v{font-size:21px;font-weight:600}

/* Colonne droite */
.right{flex:1;display:flex;flex-direction:column;min-width:0}
.row{display:flex;height:214px;margin-bottom:16px}
.tr{flex:1.3;margin-right:16px;display:flex;flex-direction:column}
.tl{display:flex;align-items:center;margin-top:14px}
.badge{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:27px;font-weight:700;color:var(--badge-ink);margin-right:14px;flex:none}
.badge.tram{background:var(--tram);border-radius:50%}
.badge.bus{background:var(--bus);border-radius:11px}
.tl-s{font-size:21px;font-weight:600;line-height:1.15}
.tl-d{font-size:16px;color:var(--muted)}
.tl-m{margin-left:auto;text-align:right}
.tl-m b{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:46px;font-weight:600;line-height:1}
.tl-m small{font-size:18px;font-weight:600;margin-left:4px}
.tl-n{font-size:15px;color:var(--muted)}
.bd{flex:1;display:flex;flex-direction:column}
.bd-q{font-size:36px;font-weight:600;margin-top:auto;line-height:1.05}
.bd-j{font-size:24px;font-weight:700;color:var(--fete);margin-top:6px}
.bd-d{font-size:17px;color:var(--muted);margin-top:4px}

.ag{flex:1;margin-bottom:16px;display:flex;flex-direction:column;min-height:0}
.ev{display:flex;align-items:center;margin-top:12px}
.ev-h{width:94px;font-size:21px;font-weight:700;flex:none}
.ev i{width:12px;height:12px;border-radius:50%;margin-right:14px;flex:none}
.ev-n{font-size:23px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-sub{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.vide{font-size:20px;color:var(--muted);margin-top:14px}

.home{height:166px;display:flex;flex-direction:column}
.home-top{display:flex;align-items:baseline;justify-content:space-between}
.home-s{font-size:19px;font-weight:600}
.sc{display:flex;margin-top:auto}
.scene{flex:1;height:76px;margin-right:10px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:19px;font-weight:600;transition:background-color .3s,color .3s}
.scene:last-child{margin-right:0}
.scene svg{width:26px;height:26px;margin-right:9px}
.scene.on{background:var(--accent);color:var(--on-ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="hello">
      <div class="greet h" id="greet"></div>
      <div class="date" id="date"></div>
      <div class="fete" id="fete"></div>
    </div>
    <div class="card wx">
      <div class="label">Météo · Tours Nord</div>
      <div class="wx-main"><div id="wxIcon"></div><div class="wx-temp h" id="wxTemp"></div></div>
      <div class="wx-cond" id="wxCond"></div>
      <div class="wx-hl" id="wxHL"></div>
      <div id="wxAlert"></div>
      <div class="mini-h" id="wxHours"></div>
    </div>
  </div>
  <div class="right">
    <div class="row">
      <div class="card tr"><div class="label">Prochains départs</div><div id="tr"></div></div>
      <div class="card bd" id="bd"></div>
    </div>
    <div class="card ag" id="ag"></div>
    <div class="card home">
      <div class="home-top"><div class="label">Maison</div><div class="home-s" id="homeS"></div></div>
      <div class="sc" id="sc"></div>
    </div>
  </div>
</div>

<script>
/* ===================== RÉGLAGES ===================== */
var CONFIG = {
  DEMO: true,             // données d'exemple pour transports, agenda, maison, anniversaires
  METEO_REELLE: true,     // météo réelle via Open-Meteo (gratuit, sans clé)
  LAT: 47.418, LON: 0.688
};
/* ==================================================== */

function param(n){ var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function themeAuto(){ var h = new Date().getHours(); return (h >= 19 || h < 7) ? 'nuit' : 'jour'; }
function appliquerTheme(t){ if (!t || t === 'auto') t = themeAuto(); document.documentElement.className = t === 'nuit' ? 'nuit' : ''; }
appliquerTheme(param('theme'));
window.addEventListener('message', function(e){ if (e.data && e.data.type === 'theme') appliquerTheme(e.data.value); });
function signalerToucher(){ if (window.parent !== window) { try { window.parent.postMessage({ type: 'interaction' }, '*'); } catch (err) {} } }
document.addEventListener('touchstart', signalerToucher, true);
document.addEventListener('mousedown', signalerToucher, true);
function $(id){ return document.getElementById(id); }
var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function majuscule(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---------- Icônes météo (identiques à meteo.html) ---------- */
function iSoleil(cx, cy, r, r1, r2){
  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="var(--sun)"/>';
  for (var a = 0; a < 8; a++) {
    var ang = a * Math.PI / 4, c = Math.cos(ang), si = Math.sin(ang);
    s += '<line x1="' + (cx + c * r1).toFixed(1) + '" y1="' + (cy + si * r1).toFixed(1) + '" x2="' + (cx + c * r2).toFixed(1) + '" y2="' + (cy + si * r2).toFixed(1) + '" stroke="var(--sun)" stroke-width="3.2" stroke-linecap="round"/>';
  }
  return s;
}
function iLune(){ return '<path d="M38 14a18 18 0 1 0 12 30A15 15 0 0 1 38 14z" fill="var(--moon)"/>'; }
function iNuage(){ return '<path d="M19 50h28a11 11 0 0 0 1.5-21.9A15 15 0 0 0 20 31a9.5 9.5 0 0 0-1 19z" fill="var(--cloud)"/>'; }
function iGouttes(n){
  var xs = n === 2 ? [27, 39] : [23, 33, 43], s = '';
  for (var k = 0; k < xs.length; k++) s += '<path d="M' + xs[k] + ' 49l-3 8" stroke="var(--rain)" stroke-width="3.6" stroke-linecap="round"/>';
  return s;
}
function iconeMeteo(code, jour, taille){
  var c = code, s = '<svg width="' + taille + '" height="' + taille + '" viewBox="0 0 64 64">';
  var haut = '<g transform="translate(0,-7)">' + iNuage() + '</g>';
  var petitAstre = jour ? iSoleil(22, 20, 8, 12, 16) : '<g transform="translate(-2,-7) scale(.7)">' + iLune() + '</g>';
  if (c === 0) s += jour ? iSoleil(32, 32, 11, 16, 22) : iLune();
  else if (c === 1 || c === 2) s += petitAstre + '<g transform="translate(4,6)">' + iNuage() + '</g>';
  else if (c === 3) s += iNuage();
  else if (c === 45 || c === 48) s += '<g stroke="var(--cloud)" stroke-width="4" stroke-linecap="round"><path d="M14 24h36M10 33h44M14 42h36M20 51h24"/></g>';
  else if (c >= 95) s += haut + '<path d="M34 43l-8 11h6l-3 8 10-12h-6l3-7z" fill="var(--sun)"/>';
  else if ((c >= 71 && c <= 77) || c === 85 || c === 86) s += haut + '<g fill="var(--rain)"><circle cx="24" cy="52" r="2.6"/><circle cx="33" cy="57" r="2.6"/><circle cx="42" cy="52" r="2.6"/></g>';
  else if (c >= 80 && c <= 82) s += (jour ? iSoleil(20, 15, 7, 10.5, 14) : '') + haut + iGouttes(3);
  else if (c >= 51 && c <= 57) s += haut + iGouttes(2);
  else if (c >= 61) s += haut + iGouttes(3);
  else s += iNuage();
  return s + '</svg>';
}
function libelleMeteo(c, jour){
  if (c === 0) return jour ? 'Ensoleillé' : 'Ciel dégagé';
  if (c === 1) return 'Peu nuageux'; if (c === 2) return 'Éclaircies'; if (c === 3) return 'Couvert';
  if (c === 45 || c === 48) return 'Brouillard'; if (c >= 51 && c <= 57) return 'Bruine';
  if (c >= 61 && c <= 67) return 'Pluie'; if (c >= 71 && c <= 77) return 'Neige';
  if (c >= 80 && c <= 82) return 'Averses'; if (c >= 95) return 'Orage';
  return '';
}

/* ---------- Données d'exemple ---------- */
function mockTemp(h){ return Math.round(12.5 + 3.5 * Math.cos((h - 15) / 24 * 2 * Math.PI)); }
function mockCode(h){
  if (h === 20 || h === 21) return 80; if (h === 22) return 61;
  if (h >= 23 || h <= 2) return 3; if (h <= 8) return 2; if (h <= 11) return 1; if (h <= 16) return 2; return 3;
}
function jourA(h){ return h >= 9 && h < 19; }
var t0 = Date.now();
var DEMO_TR = [
  { ligne: 'A', type: 'tram', arret: 'Monconseil', direction: 'Jean Monnet', marche: 6, passages: [3.6, 11.2, 19.4] },
  { ligne: '2', type: 'bus', arret: 'Maréchal Juin', direction: 'CHU Trousseau', marche: 4, passages: [7.3, 21.5, 35.2] }
];
var DEMO_AG = [
  { j: 0, debut: '08:30', titre: 'Point d\'équipe', qui: 'moi' },
  { j: 0, debut: '20:30', titre: 'Cinéma', qui: 'nous' },
  { j: 1, debut: '12:30', titre: 'Déjeuner avec Marc', qui: 'moi' },
  { j: 1, debut: '18:30', titre: 'Yoga', qui: 'elle' }
];
var COULEURS = { moi: 'var(--accent)', elle: 'var(--p2)', nous: 'var(--nous)' };
var DEMO_ANNIV = { nom: 'Lucie', jour: 22, mois: 10, annee: 1995 };
var lumieres = 3, sceneActive = 'soiree';

/* ---------- Météo : réelle (Open-Meteo) ou exemple ---------- */
var meteo = null;
var PARAPLUIE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9zM12 12v6a2 2 0 0 0 4 0"/></svg>';
function lireDate(s){ var p = s.split(/[-T:]/); return new Date(+p[0], +p[1] - 1, +p[2], +(p[3] || 0), +(p[4] || 0)); }
function chargerMeteo(){
  if (!CONFIG.METEO_REELLE) return;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.LAT + '&longitude=' + CONFIG.LON +
    '&current=temperature_2m,weather_code,is_day&minutely_15=precipitation&forecast_minutely_15=8' +
    '&hourly=temperature_2m,weather_code,is_day&forecast_hours=13' +
    '&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis&forecast_days=1', true);
  xhr.timeout = 20000;
  xhr.onload = function(){
    if (xhr.status !== 200) return;
    try { meteo = JSON.parse(xhr.responseText); afficherMeteo(); } catch (e) {}
  };
  xhr.send();
}
function afficherMeteo(){
  var h = new Date().getHours(), mh = '', i;
  if (!meteo) {
    if (CONFIG.METEO_REELLE) { $('wxCond').innerHTML = 'Chargement…'; return; }
    var code = mockCode(h);
    $('wxIcon').innerHTML = iconeMeteo(code, jourA(h), 112);
    $('wxTemp').innerHTML = mockTemp(h) + '°';
    $('wxCond').innerHTML = libelleMeteo(code, jourA(h));
    $('wxHL').innerHTML = 'Max 16° · Min 9°';
    $('wxAlert').innerHTML = '<div class="alert">' + PARAPLUIE + textePluie() + '</div>';
    for (i = 1; i <= 5; i++) {
      var hh = (h + i * 2) % 24;
      mh += '<div class="mh"><div class="mh-t">' + hh + ' h</div>' + iconeMeteo(mockCode(hh), jourA(hh), 40) + '<div class="mh-v">' + mockTemp(hh) + '°</div></div>';
    }
    $('wxHours').innerHTML = mh;
    return;
  }
  var c = meteo.current, now = new Date();
  $('wxIcon').innerHTML = iconeMeteo(c.weather_code, c.is_day === 1, 112);
  $('wxTemp').innerHTML = Math.round(c.temperature_2m) + '°';
  $('wxCond').innerHTML = libelleMeteo(c.weather_code, c.is_day === 1);
  $('wxHL').innerHTML = 'Max ' + Math.round(meteo.daily.temperature_2m_max[0]) + '° · Min ' + Math.round(meteo.daily.temperature_2m_min[0]) + '°';
  // Pluie dans l'heure
  var debut = null, M = meteo.minutely_15, vus = 0;
  for (i = 0; i < M.time.length && vus < 4; i++) {
    var fin = lireDate(M.time[i]);
    if (fin <= now) continue;
    vus++;
    if ((M.precipitation[i] || 0) >= 0.05) { debut = new Date(Math.max(now.getTime(), fin.getTime() - 15 * 60000)); break; }
  }
  if (debut) {
    debut.setMinutes(Math.ceil(debut.getMinutes() / 5) * 5);
    $('wxAlert').innerHTML = '<div class="alert">' + PARAPLUIE + (debut - now < 10 * 60000 ? 'Il pleut en ce moment' : 'Pluie vers ' + debut.getHours() + ' h ' + pad(debut.getMinutes())) + '</div>';
  } else {
    $('wxAlert').innerHTML = '<div class="alert sec">' + PARAPLUIE + 'Pas de pluie dans l\'heure</div>';
  }
  // Mini prévisions : toutes les 2 heures
  var H = meteo.hourly, debutHeure = new Date(now.getTime()); debutHeure.setMinutes(0, 0, 0);
  var liste = [];
  for (i = 0; i < H.time.length; i++) if (lireDate(H.time[i]) >= debutHeure) liste.push(i);
  for (var k = 2; k < liste.length && k <= 10; k += 2) {
    var j = liste[k];
    mh += '<div class="mh"><div class="mh-t">' + lireDate(H.time[j]).getHours() + ' h</div>' + iconeMeteo(H.weather_code[j], H.is_day[j] === 1, 40) + '<div class="mh-v">' + Math.round(H.temperature_2m[j]) + '°</div></div>';
  }
  $('wxHours').innerHTML = mh;
}
chargerMeteo();
setInterval(chargerMeteo, 15 * 60000);

function textePluie(){
  // même logique que meteo.html : début de pluie dans 7 tranches de 5 min
  var t = new Date(Date.now() + 7 * 5 * 60000);
  t.setMinutes(Math.ceil(t.getMinutes() / 5) * 5);
  return 'Pluie modérée vers ' + t.getHours() + ' h ' + pad(t.getMinutes());
}

/* ---------- Affichage ---------- */
function afficher(){
  var now = new Date(), h = now.getHours(), minNow = h * 60 + now.getMinutes();

  // Bonjour
  $('greet').innerHTML = h < 5 ? 'Bonne nuit' : (h < 12 ? 'Bonjour' : (h < 18 ? 'Bon après-midi' : 'Bonsoir'));
  $('date').innerHTML = majuscule(JOURS[now.getDay()]) + ' ' + now.getDate() + ' ' + MOIS[now.getMonth()];
  $('fete').innerHTML = 'Bonne fête aux René' + (CONFIG.DEMO ? '<span class="demo">données d\'exemple</span>' : '');

  // Météo
  afficherMeteo();

  // Transports
  var tr = '';
  for (var k = 0; k < DEMO_TR.length; k++) {
    var L = DEMO_TR[k], restants = [];
    for (var p = 0; p < L.passages.length; p++) {
      var m = Math.floor((t0 + L.passages[p] * 60000 - Date.now()) / 60000);
      if (m >= 0) restants.push(m);
    }
    if (!restants.length) { t0 = Date.now(); restants = [3]; }
    tr += '<div class="tl"><div class="badge ' + L.type + '">' + L.ligne + '</div>' +
      '<div><div class="tl-s">' + L.arret + '</div><div class="tl-d">vers ' + L.direction + '</div></div>' +
      '<div class="tl-m"><b>' + (restants[0] < 1 ? '&lt;1' : restants[0]) + '</b><small>min</small>' +
      '<div class="tl-n">' + (restants[1] !== undefined ? 'puis ' + restants[1] + ' min' : '') + '</div></div></div>';
  }
  $('tr').innerHTML = tr;

  // Anniversaire
  var auj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dA = new Date(auj.getFullYear(), DEMO_ANNIV.mois - 1, DEMO_ANNIV.jour);
  if (dA < auj) dA = new Date(auj.getFullYear() + 1, DEMO_ANNIV.mois - 1, DEMO_ANNIV.jour);
  var nj = Math.round((dA - auj) / 86400000);
  $('bd').innerHTML = '<div class="label">Prochain anniversaire</div>' +
    '<div class="bd-q h">' + DEMO_ANNIV.nom + '</div>' +
    '<div class="bd-j">' + (nj === 0 ? 'Aujourd\'hui !' : (nj === 1 ? 'Demain' : 'Dans ' + nj + ' jours')) + '</div>' +
    '<div class="bd-d">' + JOURS[dA.getDay()] + ' ' + dA.getDate() + ' ' + MOIS[dA.getMonth()] + ' · ' + (dA.getFullYear() - DEMO_ANNIV.annee) + ' ans</div>';

  // Agenda : ce qui reste aujourd'hui, puis demain
  var ag = '<div class="label">À venir</div>', restAuj = [], demain = [];
  for (var e = 0; e < DEMO_AG.length; e++) {
    var ev = DEMO_AG[e], hm = ev.debut.split(':'), mEv = parseInt(hm[0], 10) * 60 + parseInt(hm[1], 10);
    if (ev.j === 0 && mEv + 30 >= minNow) restAuj.push(ev);
    if (ev.j === 1) demain.push(ev);
  }
  function ligneEv(x){ return '<div class="ev"><div class="ev-h">' + x.debut.replace(':', ' h ') + '</div><i style="background:' + COULEURS[x.qui] + '"></i><div class="ev-n">' + x.titre + '</div></div>'; }
  ag += '<div class="ev-sub">Aujourd\'hui</div>';
  if (!restAuj.length) ag += '<div class="vide">Plus rien de prévu</div>';
  for (e = 0; e < restAuj.length && e < 2; e++) ag += ligneEv(restAuj[e]);
  if (demain.length) { ag += '<div class="ev-sub">Demain</div>'; for (e = 0; e < demain.length && e < 2; e++) ag += ligneEv(demain[e]); }
  $('ag').innerHTML = ag;

  afficherMaison();
}

var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
var SCENES = [
  { id: 'soiree', nom: 'Soirée', icone: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>', nb: 3 },
  { id: 'film', nom: 'Film', icone: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>', nb: 1 },
  { id: 'diner', nom: 'Dîner', icone: '<path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17 21V3c-2.2 1.8-3 4.5-3 8h3"/>', nb: 3 },
  { id: 'eteindre', nom: 'Tout éteindre', icone: '<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>', nb: 0 }
];
function afficherMaison(){
  $('homeS').innerHTML = lumieres === 0 ? 'Tout est éteint' : lumieres + (lumieres > 1 ? ' lumières allumées' : ' lumière allumée');
  var s = '';
  for (var i = 0; i < SCENES.length; i++) s += '<div class="scene' + (SCENES[i].id === sceneActive ? ' on' : '') + '" data-i="' + i + '">' + SVG + SCENES[i].icone + '</svg>' + SCENES[i].nom + '</div>';
  $('sc').innerHTML = s;
}
$('sc').addEventListener('click', function(e){
  var el = e.target;
  while (el && el.getAttribute && el.getAttribute('data-i') === null) el = el.parentNode;
  if (!el || !el.getAttribute) return;
  var S = SCENES[parseInt(el.getAttribute('data-i'), 10)];
  if (CONFIG.DEMO) { sceneActive = S.id; lumieres = S.nb; afficherMaison(); }
});

afficher();
setInterval(afficher, 20000);
</script>
</body>
</html>
