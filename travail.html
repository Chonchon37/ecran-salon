<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Travail</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E3E8DD; --card:#FAFBF8; --card2:#D9E0D1; --ink:#0F1712; --muted:#414D45; --line:#B7C1AF;
  --p2:#94679A; --p2-soft:#EBDDEC; --nous:#2F6FB8; --accent:#587A57; --fete:#C98622; --rain:#3B74A6; --warn:#BC6430; --warn-soft:#F2DCCB;
}
html.nuit{
  --bg:#0B1016; --card:#18212A; --card2:#26323E; --ink:#F4F7F3; --muted:#AEBAB4; --line:#3A4856;
  --p2:#C49BCB; --p2-soft:#33243A; --nous:#6EA6E6; --accent:#92B28E; --fete:#E0A847; --rain:#6EA5D5; --warn:#E38A52; --warn-soft:#3A2619;
}
html,body{margin:0;width:1280px;height:728px;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:Figtree,Roboto,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background-color .8s,color .8s}
.h{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif}
.wrap{box-sizing:border-box;width:1280px;height:728px;padding:24px 36px;display:flex;flex-direction:column}
.card{background:var(--card);border-radius:20px;box-sizing:border-box;padding:24px 30px;transition:background-color .8s}
.label{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.demo{margin-left:10px;font-size:12px;letter-spacing:.06em;padding:3px 9px;border-radius:20px;background:var(--warn-soft);color:var(--warn)}

.main{flex:1;display:flex;margin-top:16px;min-height:0}
/* Jour mis en avant */
.hero{width:380px;flex:none;margin-right:16px;display:flex;flex-direction:column}
.quand{display:flex;align-items:center;font-size:22px;font-weight:700;color:var(--muted)}
.quand i{font-style:normal;width:46px;height:46px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:12px}
.lieu{font-size:58px;font-weight:600;line-height:1.02;letter-spacing:-.02em;margin-top:18px;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.lieu.repos{color:var(--muted)}
.heures{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:32px;font-weight:600;margin-top:12px}
.adresse{font-size:19px;color:var(--muted);margin-top:6px;line-height:1.3}
.trajet{display:flex;align-items:center;align-self:flex-start;margin-top:14px;padding:9px 16px 9px 12px;border-radius:14px;background:var(--card2);font-size:22px;font-weight:700}
.trajet svg{width:28px;height:28px;margin-right:10px;flex:none}
.trajet small{font-size:17px;font-weight:600;color:var(--muted);margin-left:10px}
.depart{margin-top:12px;font-size:22px;color:var(--muted);white-space:nowrap}
.depart small{font-size:19px}
.depart b{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:30px;font-weight:600;color:var(--ink)}
.trajet.attente{font-size:17px;font-weight:600;color:var(--muted)}
.suite{margin-top:auto;border-top:1.5px solid var(--line);padding-top:12px}
.s-l{display:flex;align-items:baseline;font-size:20px;line-height:1.75}
.s-j{width:92px;flex:none;color:var(--muted);font-weight:700}
.s-n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-n i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;vertical-align:middle;position:relative;top:-2px}
.s-r{font-size:18px;color:var(--muted);margin-top:6px}
.s-r b{color:var(--ink)}
/* Deux semaines */
.sem{flex:1;display:flex;flex-direction:column;min-width:0}
.semaine{flex:1;display:flex;flex-direction:column;min-height:0}
.semaine + .semaine{margin-top:16px}
.semaine .label{margin-bottom:8px}
.ligne{flex:1;display:flex;min-height:0}
.j{flex:1;min-width:0;margin-right:8px;border-radius:14px;background:var(--card2);padding:10px 10px 9px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
.j:last-child{margin-right:0}
.j.we{flex:.62}
.we .j-t{flex-direction:column;align-items:flex-start}
.we .j-t span{margin:0 0 3px}
.j-t{display:flex;align-items:baseline;white-space:nowrap}
.j-t span{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.j-t b{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:24px;line-height:1}
.j .n{font-size:17px;font-weight:700;margin-top:8px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.j .t{font-size:15px;font-weight:600;color:var(--muted);margin-top:auto;padding-top:4px;white-space:nowrap}
.j .r{font-size:16px;color:var(--muted);margin-top:8px}
.j.libre{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.j.passe{opacity:.38}
.j.auj{box-shadow:inset 0 0 0 3px var(--ink)}
.j.vise{background:var(--card);box-shadow:inset 0 0 0 2px var(--muted)}
.j.vise.auj{box-shadow:inset 0 0 0 3px var(--ink)}
.vide{font-size:22px;color:var(--muted)}
.lieu b,.s-n b,.j .n b{font-weight:700}
.lieu .ls,.s-n .ls,.j .n .ls{font-weight:400}
</style>
</head>
<body>
<div class="wrap">
  <div class="label" id="titre">Travail<span class="demo" id="demo">exemple</span></div>
  <div class="main">
    <div class="card hero" id="hero"></div>
    <div class="card sem" id="sem"></div>
  </div>
</div>

<script>
/* ===================== RÉGLAGES ===================== */
// Lieux de travail : événements de Google Agenda dont le titre contient 💼 (ex. « 💼 Agence Tours Nord »).
// Ils n'apparaissent pas dans l'agenda, seulement ici et dans la tuile Travail de l'accueil.
var CONFIG = { WORKER: 'https://ecran-salon.nico-michon37.workers.dev/agenda', PRENOM: 'Flo' };
/* ==================================================== */

function param(n){ var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function themeAuto(){ var h = new Date().getHours(); return (h >= 19 || h < 7) ? 'nuit' : 'jour'; }
function appliquerTheme(t){ if (!t || t === 'auto') t = themeAuto(); document.documentElement.className = t === 'nuit' ? 'nuit' : ''; }
appliquerTheme(param('theme'));
function signalerToucher(){ if (window.parent !== window) { try { window.parent.postMessage({ type: 'interaction' }, '*'); } catch (err) {} } }
document.addEventListener('touchstart', signalerToucher, true);
document.addEventListener('mousedown', signalerToucher, true);
function $(id){ return document.getElementById(id); }
function echapper(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
// Lieu : premier mot en gras, la suite en normal (« <b>Langeais</b> agence »)
function lieuHtml(t){
  var parts = String(t).split(' puis '), res = [];
  for (var i = 0; i < parts.length; i++) {
    var m = /^(\S+)(\s+[\s\S]*)?$/.exec(parts[i]);
    res.push(m ? '<b>' + echapper(m[1]) + '</b>' + (m[2] ? '<span class="ls">' + echapper(m[2]) + '</span>' : '') : echapper(parts[i]));
  }
  return res.join(' <span class="ls">puis</span> ');
}
var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
var MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
var CLE = param('cle');
function enDemo(){ return !CONFIG.WORKER || !CLE; }

var travail = null;   // liste reçue du Worker : { debut, fin, journee, lieu, adresse }

function exemple(){
  var L = [], b = new Date(); b = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  for (var d = 0; d < 14; d++) {
    var j = new Date(b.getFullYear(), b.getMonth(), b.getDate() + d), w = j.getDay();
    if (w > 0 && w < 6) L.push({ debut: j.getTime() + 8.5 * 3600000, fin: j.getTime() + 17 * 3600000, journee: false, lieu: w === 3 ? 'Liberté' : 'Langeais', adresse: '' });
  }
  return L;
}
function duJour(liste, j){
  var a = j.getTime(), b = new Date(j.getFullYear(), j.getMonth(), j.getDate() + 1).getTime(), res = [];
  for (var i = 0; i < liste.length; i++) {
    var E = liste[i];
    if (E.debut >= b || E.fin <= a) continue;
    if (!E.journee && E.debut < a) continue;
    res.push(E);
  }
  return res;
}
function lieux(L){ var n = []; for (var i = 0; i < L.length; i++) if (n.indexOf(L[i].lieu) < 0) n.push(L[i].lieu); return n.join(' puis '); }
function heures(L, court){
  var a = null, b = null;
  for (var i = 0; i < L.length; i++) { if (L[i].journee) continue; if (a === null || L[i].debut < a) a = L[i].debut; if (b === null || L[i].fin > b) b = L[i].fin; }
  if (a === null) return '';
  function f(t){ var x = new Date(t); return court ? x.getHours() + 'h' + (x.getMinutes() ? pad(x.getMinutes()) : '') : pad(x.getHours()) + ' h ' + pad(x.getMinutes()); }
  return f(a) + (court ? '–' : ' – ') + f(b);
}

// Une couleur par lieu, toujours la même pour un même lieu
var TEINTES = ['var(--p2)', 'var(--nous)', 'var(--accent)', 'var(--fete)', 'var(--rain)', 'var(--warn)'], teintesVues = [];
function teinte(n){ var i = teintesVues.indexOf(n); if (i < 0) { teintesVues.push(n); i = teintesVues.length - 1; } return TEINTES[i % TEINTES.length]; }
function jourPlus(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
var JOURS_C = ['Dim.', 'Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.'];

function afficher(){
  var now = new Date(), auj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var liste = travail || exemple(), d, k;
  $('titre').firstChild.nodeValue = 'Travail de ' + CONFIG.PRENOM;
  $('demo').style.display = enDemo() ? '' : 'none';
  // Jour mis en avant : le prochain jour travaillé (aujourd'hui tant que la journée n'est pas finie)
  var L0 = duJour(liste, auj), fini = L0.length > 0;
  for (var i = 0; i < L0.length; i++) if (L0[i].journee || L0[i].fin > now.getTime()) fini = false;
  var k0 = (fini || now.getHours() >= 19) ? 1 : 0;
  while (k0 < 14 && !duJour(liste, jourPlus(auj, k0)).length) k0++;
  teintesVues = [];
  if (k0 >= 14) {
    $('hero').innerHTML = '<div class="quand h"><i>💼</i>Rien de prévu</div><div class="vide" style="margin-top:18px">Aucun lieu de travail 💼 dans l\'agenda pour les 2 prochaines semaines.</div>';
  } else {
    var vise = jourPlus(auj, k0), LV = duJour(liste, vise), n = lieux(LV), hr = heures(LV, false);
    var adr = []; for (var a = 0; a < LV.length; a++) if (LV[a].adresse && LV[a].adresse !== LV[a].lieu && adr.indexOf(LV[a].adresse) < 0) adr.push(LV[a].adresse);
    var quand = k0 === 0 ? 'Aujourd\'hui' : (k0 === 1 ? 'Demain' : JOURS[vise.getDay()].charAt(0).toUpperCase() + JOURS[vise.getDay()].slice(1));
    var html = '<div class="quand h"><i>💼</i>' + quand + (k0 > 1 ? ' ' + vise.getDate() : ' · ' + JOURS[vise.getDay()] + ' ' + vise.getDate()) + '</div>' +
      '<div class="lieu h">' + lieuHtml(n) + '</div>' +
      (hr ? '<div class="heures">' + hr + '</div>' : '') +
      '<div class="adresse" id="adresseCentre">' + echapper(adr.join(' · ')) + '</div>' +
      '<div id="trajet"></div>';
    // Ensuite : les jours travaillés suivants, puis le prochain jour de repos
    var suite = '', nb = 0, repos = null;
    for (k = k0 + 1; k < 14; k++) {
      var j = jourPlus(auj, k), Lj = duJour(liste, j);
      if (!Lj.length) { if (!repos) repos = j; continue; }
      if (nb < 6) { suite += '<div class="s-l"><span class="s-j">' + (k === 1 ? 'Demain' : JOURS_C[j.getDay()] + ' ' + j.getDate()) + '</span><span class="s-n">' + lieuHtml(lieux(Lj)) + '</span></div>'; nb++; }
    }
    for (k = 0; k < k0 && !repos; k++) if (!duJour(liste, jourPlus(auj, k)).length && k > 0) repos = jourPlus(auj, k);
    html += '<div class="suite"><div class="label" style="margin-bottom:4px">Ensuite</div>' + (suite || '<div class="s-r">Rien de noté après.</div>') +
      (repos ? '<div class="s-r">Prochain repos : <b>' + JOURS[repos.getDay()] + ' ' + repos.getDate() + '</b></div>' : '') + '</div>';
    $('hero').innerHTML = html;
    VISE_PLUS_TARD = k0 > 0;
    majTrajet(n, adr[0] || '');
  }
  // Deux semaines, du lundi de cette semaine ; le week-end est plus étroit s'il n'est pas travaillé
  var lundi = jourPlus(auj, -((auj.getDay() + 6) % 7)), vue = k0 < 14 ? jourPlus(auj, k0) : null, out = '';
  var weTravaille = false;
  for (d = 0; d < 14; d++) if (d % 7 >= 5 && duJour(liste, jourPlus(lundi, d)).length) weTravaille = true;
  for (var s = 0; s < 2; s++) {
    out += '<div class="semaine"><div class="label">' + (s === 0 ? 'Cette semaine' : 'Semaine prochaine') + '</div><div class="ligne">';
    for (d = 0; d < 7; d++) {
      var jj = jourPlus(lundi, s * 7 + d), passe = jj < auj, Lx = passe ? [] : duJour(liste, jj), nx = lieux(Lx);
      var cl = 'j' + (d >= 5 && !weTravaille ? ' we' : '') + (passe ? ' passe' : '') + (!passe && !nx ? ' libre' : '') +
        (jj.getTime() === auj.getTime() ? ' auj' : '') + (vue && jj.getTime() === vue.getTime() ? ' vise' : '');
      out += '<div class="' + cl + '"><div class="j-t"><span>' + JOURS_C[jj.getDay()] + '</span><b>' + jj.getDate() + '</b></div>' +
        (passe ? '' : (nx ? '<div class="n">' + lieuHtml(nx) + '</div><div class="t">' + heures(Lx, true) + '</div>' : '<div class="r">Repos</div>')) + '</div>';
    }
    out += '</div></div>';
  }
  $('sem').innerHTML = out;
}

// Temps en voiture depuis la maison jusqu'au centre Audilab du jour (calculé par le Worker, gardé ici par lieu)
var VOITURE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-4.5l-1.8-4.6A2 2 0 0 0 15.3 6.6H8.7a2 2 0 0 0-1.9 1.3L5 12.5z"/><path d="M5 12.5h14"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/><path d="M6.5 17v2M17.5 17v2"/></svg>';
var trajets = {};
var ARRIVEE = '08:50';          // heure d'arrivée visée au centre
var VISE_PLUS_TARD = false;     // le jour mis en avant n'est pas aujourd'hui
function dureeTxt(m){ return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60 < 10 ? '0' : '') + (m % 60); }
function dessinerTrajet(cle, avecAdresse){
  var T = trajets[cle], el = $('trajet'); if (!el) return;
  if (!T) { el.innerHTML = '<div class="trajet attente">' + VOITURE + 'Calcul du trajet…</div>'; return; }
  if (T.erreur || !T.trouve) { el.innerHTML = ''; ajusterHero(); return; }
  if (avecAdresse && T.centre) $('adresseCentre').innerHTML = T.centre.approx
    ? echapper(T.centre.adresse) + ' · centre-ville (centre Audilab non trouvé, ajoute son adresse dans l\'événement)'
    : echapper(T.centre.nom + ' · ' + T.centre.adresse);
  var html = '<div class="trajet">' + VOITURE + (T.centre && T.centre.approx ? '≈ ' : '') + dureeTxt(T.minutes) + ' en voiture<small>' + T.km + ' km</small></div>';
  // Le lendemain : heure de départ pour arriver à l'heure (arrondie aux 5 minutes d'avant)
  if (VISE_PLUS_TARD) {
    var a = ARRIVEE.split(':'), dep = parseInt(a[0], 10) * 60 + parseInt(a[1], 10) - T.minutes;
    dep = Math.floor(dep / 5) * 5;
    html += '<div class="depart">Partir à <b>' + Math.floor(dep / 60) + ' h ' + pad(dep % 60) + '</b> <small> · arrivée ' + parseInt(ARRIVEE, 10) + ' h ' + ARRIVEE.split(':')[1] + '</small></div>';
  }
  el.innerHTML = html;
  ajusterHero();
}
// La liste « Ensuite » se raccourcit si la colonne déborde
function ajusterHero(){
  var h = $('hero'), L = h.querySelectorAll('.s-l'), i;
  for (i = 0; i < L.length; i++) L[i].style.display = '';
  for (i = L.length - 1; i >= 0 && h.scrollHeight > h.clientHeight + 1; i--) L[i].style.display = 'none';
}
var enCours = {};
function majTrajet(lieu, adresse){
  if (!lieu && !adresse) return;
  var cle = lieu + '|' + adresse, avecAdresse = !adresse;
  if (enDemo() && !trajets[cle]) trajets[cle] = { trouve: true, minutes: 34, km: 38, centre: { nom: 'Audilab Langeais', adresse: '15 Rue Thiers, Langeais' } };
  dessinerTrajet(cle, avecAdresse);
  if (trajets[cle] || enCours[cle]) return;
  enCours[cle] = true;
  var xhr = new XMLHttpRequest(), base = CONFIG.WORKER.replace(/\/agenda$/, '');
  function fin(j){
    enCours[cle] = false;
    trajets[cle] = j || { erreur: true };
    if (!j) setTimeout(function(){ delete trajets[cle]; }, 10 * 60000);   // on réessaiera plus tard
    dessinerTrajet(cle, avecAdresse);
  }
  xhr.open('GET', base + '/trajet?cle=' + encodeURIComponent(CLE) + '&lieu=' + encodeURIComponent(lieu) + '&adresse=' + encodeURIComponent(adresse), true);
  xhr.timeout = 30000;
  xhr.onload = function(){ var j = null; try { j = JSON.parse(xhr.responseText); } catch (e) {} fin(xhr.status === 200 && j ? j : null); };
  xhr.onerror = xhr.ontimeout = function(){ fin(null); };
  xhr.send();
}

function charger(){
  if (enDemo()) { afficher(); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', CONFIG.WORKER + '?cle=' + encodeURIComponent(CLE), true);
  xhr.timeout = 25000;
  xhr.onload = function(){
    var j = null; try { j = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200 && j) { travail = j.travail || []; afficher(); }
    else if (!travail) $('hero').innerHTML = '<div class="vide">Lieux de travail indisponibles : ' + echapper(j && j.erreur ? j.erreur : 'erreur ' + xhr.status) + '</div>';
  };
  xhr.send();
}
window.addEventListener('message', function(e){
  if (!e.data) return;
  if (e.data.type === 'theme') appliquerTheme(e.data.value);
  if (e.data.type === 'reglages' && e.data.value && e.data.value.agenda && e.data.value.agenda.personnes) { CONFIG.PRENOM = e.data.value.agenda.personnes.flo || CONFIG.PRENOM; afficher(); }
});
charger();
setInterval(charger, 15 * 60000);
setInterval(afficher, 5 * 60000);
</script>
</body>
</html>
