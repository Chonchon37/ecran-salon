<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Transports</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECE3; --card:#F7F8F4; --card2:#E3E8DD; --ink:#16201A; --muted:#55615A; --line:#D3DACE;
  --ok:#2E7346; --warn:#B4501B; --warn-soft:#F6E0D2;
  --go-bg:#2E7346; --go-ink:#FFFFFF; --hurry-bg:#B9501A; --hurry-ink:#FFFFFF; --none-bg:#E3E8DD; --none-ink:#55615A;
  --tram:#BD074E; --bus:#004488; --badge-ink:#FFFFFF;
}
html.nuit{
  --bg:#0E1216; --card:#1A1F25; --card2:#252C34; --ink:#F2F5F3; --muted:#A8B2AC; --line:#323A43;
  --ok:#5FD08A; --warn:#FF9A5C; --warn-soft:#3B2417;
  --go-bg:#2B8A4F; --go-ink:#FFFFFF; --hurry-bg:#D9622A; --hurry-ink:#FFFFFF; --none-bg:#252C34; --none-ink:#C3CBC6;
  --tram:#E0306F; --bus:#3D7FD1; --badge-ink:#FFFFFF;
}
html,body{margin:0;width:1280px;height:728px;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:Figtree,Roboto,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background-color .8s,color .8s}
.h{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif}
.wrap{box-sizing:border-box;width:1280px;height:728px;padding:24px 36px;display:flex;flex-direction:column}
.card{background:var(--card);border-radius:20px;box-sizing:border-box;padding:24px 30px;transition:background-color .8s}
.label{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.demo{margin-left:10px;font-size:12px;letter-spacing:.06em;padding:3px 9px;border-radius:20px;background:var(--warn-soft);color:var(--warn)}

.top{display:flex;align-items:center;justify-content:space-between;height:28px;margin-bottom:16px}
.upd{font-size:17px;color:var(--muted)}
.upd.vieux{color:var(--warn);font-weight:700}
.lines{flex:1;display:flex;min-height:0}
.line{flex:1;display:flex;flex-direction:column;min-width:0}
.line + .line{margin-left:16px}

/* En-tête : ligne, arrêt, direction et temps de marche */
.ln-head{display:flex;align-items:center}
.badge{width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif;font-size:36px;font-weight:700;color:var(--badge-ink);margin-right:18px;flex:none}
.badge.tram{background:var(--tram);border-radius:50%}
.badge.bus{background:var(--bus);border-radius:14px}
.ln-txt{min-width:0}
.ln-stop{font-size:32px;font-weight:600;line-height:1.1}
.ln-sub{font-size:20px;color:var(--muted);margin-top:4px;display:flex;align-items:center;white-space:nowrap}
.ln-sub svg{width:20px;height:20px;margin:0 4px 0 2px;flex:none}
.ln-sub .sep{margin:0 8px}
.ln-status{margin-left:auto;font-size:16px;font-weight:700;padding:7px 13px;border-radius:16px;background:var(--card2);color:var(--ok);align-self:flex-start;white-space:nowrap}
.ln-status.pb{background:var(--warn-soft);color:var(--warn)}
.alerte{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:19px;font-weight:600;line-height:1.3}

/* Bloc principal : quand partir, lisible de loin */
.hero{flex:1;margin-top:20px;border-radius:22px;background:var(--go-bg);color:var(--go-ink);display:flex;flex-direction:column;justify-content:center;padding:18px 30px;min-height:0}
.hero.vite{background:var(--hurry-bg);color:var(--hurry-ink)}
.hero.rien{background:var(--none-bg);color:var(--none-ink)}
.hero-l{font-size:22px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.92}
.hero-n{font-size:168px;font-weight:600;line-height:.92;letter-spacing:-.04em;margin-top:6px}
.hero-n small{font-size:52px;font-weight:600;letter-spacing:0;margin-left:10px}
.hero-n.mot{font-size:84px;line-height:1;letter-spacing:-.02em}
.hero-d{font-size:24px;font-weight:600;margin-top:14px;display:flex;align-items:baseline}
.hero-h{font-size:56px;font-weight:600;letter-spacing:-.02em;line-height:1;margin-left:12px}
.hero-x{margin-left:14px;font-size:22px;font-weight:500;opacity:.85}
.hero-d .pt{width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:9px;flex:none;align-self:center}
.hero-d .pt.prevu{background:transparent;border:2px solid currentColor;width:6px;height:6px}
.hero-d .pt.live{-webkit-animation:pulse 1.6s infinite;animation:pulse 1.6s infinite}
@-webkit-keyframes pulse{50%{opacity:.25}}
@keyframes pulse{50%{opacity:.25}}

/* Badge « trop tard à pied » */
.rate{align-self:flex-start;margin-top:12px;display:inline-flex;align-items:center;padding:7px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:18px;font-weight:700}
.rate svg{width:20px;height:20px;margin-right:8px;flex:none}

/* Frise des 60 prochaines minutes (zone hachurée = temps de marche) */
.frise{position:relative;height:84px;margin-top:16px;flex:none}
.fr-titre{position:absolute;left:0;top:0;font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fr-track{position:absolute;left:0;right:0;top:38px;height:8px;border-radius:4px;background:var(--card2)}
.fr-walk{position:absolute;left:0;top:38px;height:8px;border-radius:4px 0 0 4px;background:repeating-linear-gradient(135deg,var(--warn) 0 6px,transparent 6px 11px);opacity:.8}
.fr-dot{position:absolute;top:30px;width:24px;height:24px;margin-left:-12px;border-radius:50%;box-sizing:border-box;border:4px solid;background:var(--card)}
.fr-dot.passe{opacity:.35}
.fr-lab{position:absolute;top:62px;white-space:nowrap;font-size:17px;color:var(--muted);-webkit-transform:translateX(-50%);transform:translateX(-50%)}
.fr-lab.g{-webkit-transform:none;transform:none}
.fr-lab.d{-webkit-transform:translateX(-100%);transform:translateX(-100%)}

/* Départs suivants, sur une ligne */
.ensuite{margin-top:16px;display:flex;align-items:baseline;border-top:2px solid var(--line);padding-top:14px}
.ens-l{font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:18px}
.dep{display:flex;align-items:baseline;font-size:30px;font-weight:600}
.dep small{font-size:19px;color:var(--muted);font-weight:500;margin-left:7px}
.dep + .dep{margin-left:16px;padding-left:16px;border-left:2px solid var(--line)}
.dep i{width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;align-self:center;flex:none}
.dep i.p{background:transparent;border:2px solid var(--muted);width:5px;height:5px}
.ens-vide{font-size:19px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="label">Transports · Fil Bleu<span class="demo" id="demo">exemple</span></div>
    <div class="upd" id="upd"></div>
  </div>
  <div class="lines" id="lines"></div>
</div>

<script>
/* ===================== RÉGLAGES ===================== */
var CONFIG = {
  // Adresse du Worker Cloudflare (vide = données d'exemple)
  WORKER: 'https://ecran-salon.nico-michon37.workers.dev/transports',
  RAFRAICHIR_SEC: 30,
  LIGNES: [
    { ligne: 'A', type: 'tram', nom: 'tram', arret: 'Monconseil',    direction: 'Jean Monnet',   marche: 7, actif: true },
    { ligne: '2', type: 'bus',  nom: 'bus',  arret: 'Maréchal Juin', direction: 'CHU Trousseau', marche: 9, actif: true }
  ]
  // marche = minutes à pied jusqu'à l'arrêt (modifiable aussi depuis la page admin)
};
/* ==================================================== */

function param(n){ var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function themeAuto(){ var h = new Date().getHours(); return (h >= 19 || h < 7) ? 'nuit' : 'jour'; }
function appliquerTheme(t){ if (!t || t === 'auto') t = themeAuto(); document.documentElement.className = t === 'nuit' ? 'nuit' : ''; }
appliquerTheme(param('theme'));
window.addEventListener('message', function(e){ if (e.data && e.data.type === 'theme') appliquerTheme(e.data.value); });
function signalerToucher(){ if (window.parent !== window) { try { window.parent.postMessage({ type: 'interaction' }, '*'); } catch (err) {} } }
document.addEventListener('touchstart', signalerToucher, true);
document.addEventListener('mousedown', signalerToucher, true);
function $(id){ return document.getElementById(id); }
function hm(ms){ var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

var PIETON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 3 3v3M9 12l2-4 4 2 2 3M11 8l-2 4"/></svg>';

/* ---------- Données d'exemple : passages qui défilent vraiment ---------- */
var demo = null;
function initDemo(){
  var t = Date.now();
  demo = {
    A: { intervalle: 8.5, passages: [3.6, 11.2, 19.4, 27.8].map(function(m){ return t + m * 60000; }) },
    '2': { intervalle: 14, passages: [7.3, 21.5, 35.2].map(function(m){ return t + m * 60000; }) }
  };
}
function donneesDemo(){
  if (!demo) initDemo();
  var t = Date.now(), res = {};
  for (var cle in demo) {
    var L = demo[cle];
    while (L.passages.length && L.passages[0] < t - 20000) L.passages.shift();
    while (L.passages.length < 5) {
      var dernier = L.passages.length ? L.passages[L.passages.length - 1] : t;
      L.passages.push(dernier + L.intervalle * 60000 * (0.9 + Math.random() * 0.2));
    }
    res[cle] = {
      passages: L.passages.map(function(p, i){ return { heure: p, tempsReel: i < 2 }; }),
      perturbation: null
    };
  }
  return res;
}

/* ---------- Affichage ---------- */
function minutesAvant(ms){ return Math.floor((ms - Date.now()) / 60000); }
function enMin(m){ return m < 1 ? 'moins d\'1 min' : m + ' min'; }
var ATTENTION = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2v.1"/></svg>';
function carte(cfg, D){
  var P = (D ? D.passages : []).filter(function(p){ return p.heure > Date.now() - 30000; });
  var html = '<div class="card line"><div class="ln-head">' +
    '<div class="badge ' + cfg.type + '">' + cfg.ligne + '</div>' +
    '<div class="ln-txt"><div class="ln-stop h">' + cfg.arret + '</div>' +
    '<div class="ln-sub">vers ' + cfg.direction + '<span class="sep">·</span>' + PIETON + cfg.marche + ' min à pied</div></div>' +
    (D && D.perturbation ? '<div class="ln-status pb">Perturbé</div>' : '<div class="ln-status">Trafic normal</div>') +
    '</div>';
  if (D && D.perturbation) html += '<div class="alerte">' + D.perturbation.replace(/</g, '&lt;') + '</div>';

  // Premier passage qu'on peut encore attraper à pied
  var cible = -1;
  for (var i = 0; i < P.length; i++) if (minutesAvant(P[i].heure) - cfg.marche >= 0) { cible = i; break; }
  var Nom = cfg.nom.charAt(0).toUpperCase() + cfg.nom.slice(1);

  if (cible < 0) {
    html += '<div class="hero rien"><div class="hero-l">Prochain départ</div>' +
      '<div class="hero-n mot h">' + (P.length ? 'Trop tard' : 'Aucun') + '</div>' +
      '<div class="hero-d">' + (P.length ? Nom + ' de ' + hm(P[0].heure) + ' · rien d\'autre d\'annoncé dans les 2 h' : 'Aucun passage dans les 2 prochaines heures') + '</div></div>';
  } else {
    var p = P[cible], marge = minutesAvant(p.heure) - cfg.marche, vite = marge <= 1;
    html += '<div class="hero' + (vite ? ' vite' : '') + '"><div class="hero-l">' + (vite ? 'Pars' : 'Pars dans') + '</div>' +
      (vite ? '<div class="hero-n mot h">Maintenant</div>' : '<div class="hero-n h">' + marge + '<small>min</small></div>') +
      '<div class="hero-d"><span class="pt ' + (p.tempsReel ? 'live' : 'prevu') + '"></span>' + Nom + ' de <b class="hero-h h">' + hm(p.heure) + '</b><span class="hero-x">dans ' + enMin(minutesAvant(p.heure)) + (p.tempsReel ? '' : ' · prévu') + '</span></div></div>';
  }
  // Badge compact pour le passage qu'on ne peut plus attraper
  var rate = cible > 0 ? P[cible - 1] : null;
  if (rate) html += '<div class="rate">' + ATTENTION + hm(rate.heure) + ' — trop tard à pied</div>';

  // Frise des 60 prochaines minutes ; la zone hachurée = temps de marche
  var coul = cfg.type === 'tram' ? 'var(--tram)' : 'var(--bus)';
  html += '<div class="frise"><div class="fr-titre">Prochaine heure</div><div class="fr-track"></div>' +
    '<div class="fr-walk" style="width:' + (Math.min(cfg.marche, 60) / 60 * 100).toFixed(1) + '%"></div>';
  for (var f = 0; f < P.length; f++) {
    var mf = (P[f].heure - Date.now()) / 60000;
    if (mf < 0 || mf > 60) continue;
    html += '<div class="fr-dot' + (mf < cfg.marche ? ' passe' : '') + '" style="left:' + (mf / 60 * 100).toFixed(1) + '%;border-color:' + coul + (P[f].tempsReel ? ';background:' + coul : '') + '"></div>';
  }
  var reperes = [0, 15, 30, 45, 60];
  for (var r = 0; r < reperes.length; r++) {
    html += '<div class="fr-lab' + (r === 0 ? ' g' : (r === 4 ? ' d' : '')) + '" style="left:' + (reperes[r] / 60 * 100) + '%">' + (r === 0 ? 'maint.' : '+' + reperes[r] + ' min') + '</div>';
  }
  html += '</div>';

  // Les 2 départs suivants, sur une ligne
  var debut = cible < 0 ? P.length : cible + 1, suivants = P.slice(debut, debut + 2);
  html += '<div class="ensuite"><span class="ens-l">Ensuite</span>';
  if (!suivants.length) html += '<span class="ens-vide">rien d\'annoncé</span>';
  for (var k = 0; k < suivants.length; k++) {
    html += '<div class="dep"><i' + (suivants[k].tempsReel ? '' : ' class="p"') + '></i>' + hm(suivants[k].heure) + '<small>(+' + minutesAvant(suivants[k].heure) + ' min)</small></div>';
  }
  html += '</div></div>';
  return html;
}
var tempsReelOk = true;
function afficher(D){
  var html = '';
  for (var i = 0; i < CONFIG.LIGNES.length; i++) if (CONFIG.LIGNES[i].actif !== false) html += carte(CONFIG.LIGNES[i], D[CONFIG.LIGNES[i].ligne]);
  $('lines').innerHTML = html;
  $('demo').style.display = CONFIG.WORKER ? 'none' : '';
}
function majTexte(){
  var s = Math.round((Date.now() - derniereMaj) / 1000), z = $('upd');
  if (s > 180) { z.className = 'upd vieux'; z.innerHTML = 'Pas de mise à jour depuis ' + Math.floor(s / 60) + ' min : vérifie la connexion'; return; }
  z.className = 'upd';
  z.innerHTML = (tempsReelOk ? '' : 'Temps réel indisponible, horaires prévus · ') + (s < 15 ? 'À jour' : 'Mis à jour il y a ' + (s < 60 ? s + ' s' : Math.floor(s / 60) + ' min'));
}
var dernieresDonnees = null;
function charger(){
  if (!CONFIG.WORKER) { dernieresDonnees = donneesDemo(); derniereMaj = Date.now(); afficher(dernieresDonnees); majTexte(); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', CONFIG.WORKER, true);
  xhr.timeout = 20000;
  xhr.onload = function(){
    if (xhr.status !== 200) return;
    try {
      var j = JSON.parse(xhr.responseText), res = {};
      for (var cle in j.lignes) {
        res[cle] = {
          passages: j.lignes[cle].passages.map(function(p){ return { heure: p.t, tempsReel: p.tempsReel }; }),
          perturbation: j.lignes[cle].perturbation
        };
      }
      dernieresDonnees = res; derniereMaj = j.maj || Date.now(); tempsReelOk = j.tempsReelDisponible !== false;
      afficher(res); majTexte();
    } catch (e) {}
  };
  xhr.send();
}
// Réglages envoyés par l'écran (page admin) : temps de marche, lignes affichées
window.addEventListener('message', function(e){
  if (!e.data || e.data.type !== 'reglages' || !e.data.value || !e.data.value.transports) return;
  var T = e.data.value.transports;
  for (var i = 0; i < CONFIG.LIGNES.length; i++) {
    var r = T[CONFIG.LIGNES[i].ligne];
    if (r) { CONFIG.LIGNES[i].marche = r.marche; CONFIG.LIGNES[i].actif = r.actif; }
  }
  if (dernieresDonnees) afficher(dernieresDonnees);
});
charger();
setInterval(charger, CONFIG.RAFRAICHIR_SEC * 1000);
// Entre deux chargements, on recalcule les minutes restantes chaque 10 s
setInterval(function(){ if (dernieresDonnees) afficher(dernieresDonnees); majTexte(); }, 10000);
</script>
</body>
</html>
