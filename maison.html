<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Maison</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E8ECE3; --card:#F6F7F2; --card2:#DEE4D7; --ink:#0F1712; --muted:#414D45; --line:#B7C1AF;
  --accent:#587A57; --on-ink:#F6F7F2; --glow:#F0C567; --glow-ink:#5A3E08; --warn:#BC6430; --warn-soft:#F2DCCB;
}
html.nuit{
  --bg:#0F151C; --card:#18212A; --card2:#222D38; --ink:#F4F7F3; --muted:#AEBAB4; --line:#3A4856;
  --accent:#92B28E; --on-ink:#0F151C; --glow:#E6B451; --glow-ink:#2A1C04; --warn:#E38A52; --warn-soft:#3A2619;
}
html,body{margin:0;width:1280px;height:728px;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font-family:Figtree,Roboto,"Segoe UI",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color .8s,color .8s}
.h{font-family:"Bricolage Grotesque",Figtree,Arial,sans-serif}
.wrap{box-sizing:border-box;width:1280px;height:728px;padding:24px 36px;display:flex;flex-direction:column}
.label{font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center}
.demo{margin-left:10px;font-size:12px;letter-spacing:.06em;padding:3px 9px;border-radius:20px;background:var(--warn-soft);color:var(--warn)}

.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.sum{font-size:40px;font-weight:600;margin-top:6px}
.note{font-size:16px;color:var(--muted);margin-bottom:6px}

.scenes{display:flex;height:118px;margin-bottom:24px}
.scene{flex:1;margin-right:12px;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background-color .3s,color .3s,transform .15s}
.scene:last-child{margin-right:0}
.scene svg{width:38px;height:38px;margin-bottom:10px}
.scene span{font-size:21px;font-weight:600}
.scene.on{background:var(--accent);color:var(--on-ink)}
.scene:active,.tile:active{-webkit-transform:scale(.97);transform:scale(.97)}

.lights{flex:1;display:flex;flex-wrap:wrap;align-content:space-between;margin-top:12px}
.tile{box-sizing:border-box;width:290px;height:182px;margin-right:16px;border-radius:20px;background:var(--card);padding:20px 22px;display:flex;flex-direction:column;cursor:pointer;transition:background-color .3s}
.tile:nth-child(4n){margin-right:0}
.tile.off{background:var(--card2)}
.t-top{display:flex;justify-content:space-between;align-items:flex-start}
.bulb{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glow);color:var(--glow-ink);transition:background-color .3s}
.bulb svg{width:30px;height:30px}
.off .bulb{background:var(--card);color:var(--muted)}
.sw{width:56px;height:32px;border-radius:16px;background:var(--accent);position:relative;transition:background-color .3s}
.sw i{position:absolute;top:4px;left:28px;width:24px;height:24px;border-radius:50%;background:var(--on-ink);transition:left .2s}
.off .sw{background:var(--line)}
.off .sw i{left:4px;background:var(--card)}
.t-name{font-size:22px;font-weight:600;margin-top:auto;line-height:1.2}
.t-state{font-size:17px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="label">Maison · Home Assistant<span class="demo" id="demo">exemple, rien n'est piloté</span></div>
      <div class="sum h" id="sum"></div>
    </div>
    <div class="note">Touche un mode ou une lampe</div>
  </div>
  <div class="label">Modes</div>
  <div class="scenes" id="scenes" style="margin-top:12px"></div>
  <div class="label">Lumières</div>
  <div class="lights" id="lights"></div>
</div>

<script>
/* ===================== RÉGLAGES ===================== */
var CONFIG = {
  WORKER: 'https://ecran-salon.nico-michon37.workers.dev',
  RAFRAICHIR_SEC: 20,
  // Laisse vide pour afficher automatiquement tes 8 premières lumières et 5 premières scènes
  // (ordre alphabétique). Sinon, liste les identifiants Home Assistant voulus, dans l'ordre :
  // LUMIERES: ['light.salon', 'light.cuisine'],
  LUMIERES: [],
  SCENES: []
};
/* ==================================================== */

function param(n){ var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
function themeAuto(){ var h = new Date().getHours(); return (h >= 19 || h < 7) ? 'nuit' : 'jour'; }
function appliquerTheme(t){ if (!t || t === 'auto') t = themeAuto(); document.documentElement.className = t === 'nuit' ? 'nuit' : ''; }
appliquerTheme(param('theme'));
window.addEventListener('message', function(e){ if (e.data && e.data.type === 'theme') appliquerTheme(e.data.value); });
function signalerToucher(){ if (window.parent !== window) { try { window.parent.postMessage({ type: 'interaction' }, '*'); } catch (err) {} } }
document.addEventListener('touchstart', signalerToucher, true);
document.addEventListener('mousedown', signalerToucher, true);
function $(id){ return document.getElementById(id); }
function echapper(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
var CLE = param('cle');
function enDemo(){ return !CONFIG.WORKER || !CLE; }

var SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">';
var ICONES = {
  soleil: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  lune: '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>',
  tele: '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
  couverts: '<path d="M7 3v18M4.5 3v5a2.5 2.5 0 0 0 5 0V3M17 21V3c-2.2 1.8-3 4.5-3 8h3"/>',
  verre: '<path d="M9 2.5h6l-.6 7.5a2.4 2.4 0 0 1-4.8 0z"/><path d="M12 12.5v8M8.5 21h7M9.3 6h5.4"/>',
  off: '<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',
  lit: '<path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 14h18M3 18v2M21 18v2M7 9V6h4v3"/>',
  etoile: '<path d="M12 3l2.6 5.5 6 .8-4.4 4.1 1.1 5.9L12 16.4 6.7 19.3l1.1-5.9L3.4 9.3l6-.8z"/>',
  ampoule: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/>'
};
// Icône d'une scène devinée d'après son nom
function iconeScene(nom){
  var n = nom.toLowerCase();
  if (/éteind|eteind|off|dodo|nuit|coucher|départ|depart|absent/.test(n)) return /nuit|dodo|coucher/.test(n) ? 'lit' : 'off';
  if (/film|ciné|cine|télé|tele|tv|série|serie/.test(n)) return 'tele';
  if (/apéro|apero|verre|fête|fete/.test(n)) return 'verre';
  if (/dîner|diner|repas|déjeuner|dejeuner|cuisine/.test(n)) return 'couverts';
  if (/soir|cosy|détente|detente|calme|tamis/.test(n)) return 'lune';
  if (/matin|bonjour|réveil|reveil|jour|lumineux|travail/.test(n)) return 'soleil';
  return 'etoile';
}

/* ---------- Données d'exemple (sans clé) ---------- */
var DEMO = {
  lumieres: [
    { id: 'light.salon_plafonnier', nom: 'Salon · plafonnier', allumee: false, dispo: true },
    { id: 'light.lampe_canape', nom: 'Salon · lampe canapé', allumee: true, dispo: true, luminosite: 60 },
    { id: 'light.salle_a_manger', nom: 'Salle à manger', allumee: false, dispo: true },
    { id: 'light.cuisine_ruban', nom: 'Cuisine · ruban LED', allumee: true, dispo: true, luminosite: 40 },
    { id: 'light.chambre', nom: 'Chambre', allumee: false, dispo: true },
    { id: 'light.bureau', nom: 'Bureau', allumee: false, dispo: true },
    { id: 'light.entree', nom: 'Entrée', allumee: false, dispo: true },
    { id: 'light.guirlande', nom: 'Terrasse · guirlande', allumee: true, dispo: true, luminosite: 100 }
  ],
  scenes: [
    { id: 'scene.bonjour', nom: 'Bonjour' }, { id: 'scene.soiree', nom: 'Soirée cosy' },
    { id: 'scene.film', nom: 'Film' }, { id: 'scene.diner', nom: 'Dîner' }, { id: 'scene.eteindre', nom: 'Tout éteindre' }
  ]
};

/* ---------- Choix des lumières et scènes à afficher ---------- */
function choisir(liste, choix, max){
  if (!choix.length) return liste.slice(0, max);
  var res = [];
  for (var i = 0; i < choix.length; i++) for (var k = 0; k < liste.length; k++) if (liste[k].id === choix[i]) res.push(liste[k]);
  return res.slice(0, max);
}
var donnees = null, sceneActive = null, enAttente = {};

/* ---------- Affichage ---------- */
function afficher(){
  var D = donnees || DEMO, html = '', i;
  var lum = choisir(D.lumieres, CONFIG.LUMIERES, 8), sc = choisir(D.scenes, CONFIG.SCENES, 5);
  var allumees = 0;
  for (i = 0; i < D.lumieres.length; i++) if (D.lumieres[i].allumee) allumees++;
  for (i = 0; i < lum.length; i++) {
    var L = lum[i], on = L.allumee;
    var etat = !L.dispo ? 'Indisponible' : (enAttente[L.id] ? 'Un instant…' : (on ? 'Allumée' + (L.luminosite ? ' · ' + L.luminosite + ' %' : '') : 'Éteinte'));
    html += '<div class="tile' + (on ? '' : ' off') + '" data-id="' + echapper(L.id) + '"' + (L.dispo ? '' : ' style="opacity:.5"') + '>' +
      '<div class="t-top"><div class="bulb">' + SVG + ICONES.ampoule + '</svg></div><div class="sw"><i></i></div></div>' +
      '<div class="t-name">' + echapper(L.nom) + '</div><div class="t-state">' + etat + '</div></div>';
  }
  if (!lum.length) html = '<div class="t-state">Aucune lumière trouvée dans Home Assistant.</div>';
  $('lights').innerHTML = html;
  $('sum').innerHTML = allumees === 0 ? 'Tout est éteint' : allumees + (allumees > 1 ? ' lumières allumées' : ' lumière allumée');

  // Scène active : celle touchée ici, sinon la dernière lancée dans Home Assistant (moins de 6 h)
  var active = sceneActive, recent = 0;
  if (!active) for (i = 0; i < sc.length; i++) if (sc[i].derniere && sc[i].derniere > recent && Date.now() - sc[i].derniere < 6 * 3600000) { recent = sc[i].derniere; active = sc[i].id; }
  var h = '';
  for (i = 0; i < sc.length; i++) {
    h += '<div class="scene' + (sc[i].id === active ? ' on' : '') + '" data-id="' + echapper(sc[i].id) + '">' + SVG + ICONES[iconeScene(sc[i].nom)] + '</svg><span>' + echapper(sc[i].nom) + '</span></div>';
  }
  if (!sc.length) h = '<div class="t-state">Aucune scène trouvée dans Home Assistant.</div>';
  $('scenes').innerHTML = h;
  $('demo').style.display = enDemo() ? '' : 'none';
}
function erreur(msg){ $('sum').innerHTML = '<span style="color:var(--warn);font-size:24px">' + echapper(msg) + '</span>'; }

/* ---------- Échanges avec le Worker ---------- */
function charger(){
  if (enDemo()) { afficher(); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', CONFIG.WORKER + '/maison?cle=' + encodeURIComponent(CLE), true);
  xhr.timeout = 20000;
  xhr.onload = function(){
    var j = null; try { j = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 200 && j) { donnees = j; enAttente = {}; afficher(); }
    else erreur('Maison indisponible : ' + (j && j.erreur ? j.erreur : 'erreur ' + xhr.status));
  };
  xhr.onerror = xhr.ontimeout = function(){ if (!donnees) erreur('Maison injoignable, nouvel essai bientôt'); };
  xhr.send();
}
function action(type, id, apres){
  var xhr = new XMLHttpRequest();
  xhr.open('POST', CONFIG.WORKER + '/maison/action?cle=' + encodeURIComponent(CLE), true);
  xhr.setRequestHeader('Content-Type', 'text/plain');
  xhr.timeout = 15000;
  xhr.onload = function(){
    if (xhr.status !== 200) { var j = null; try { j = JSON.parse(xhr.responseText); } catch (e) {} erreur('Action impossible : ' + (j && j.erreur ? j.erreur : 'erreur ' + xhr.status)); }
    setTimeout(charger, 1200);
    if (apres) apres();
  };
  xhr.onerror = xhr.ontimeout = function(){ erreur('Action impossible, réseau indisponible'); setTimeout(charger, 3000); };
  xhr.send(JSON.stringify({ action: type, id: id }));
}

/* ---------- Touchers ---------- */
function cible(e, classe){
  var el = e.target;
  while (el && el !== document.body) { if (el.className && (' ' + el.className + ' ').indexOf(' ' + classe + ' ') >= 0) return el; el = el.parentNode; }
  return null;
}
function trouver(liste, id){ for (var i = 0; i < liste.length; i++) if (liste[i].id === id) return liste[i]; return null; }
$('lights').addEventListener('click', function(e){
  var t = cible(e, 'tile'); if (!t) return;
  var id = t.getAttribute('data-id'), D = donnees || DEMO, L = trouver(D.lumieres, id);
  if (!L || !L.dispo) return;
  L.allumee = !L.allumee; if (!L.allumee) L.luminosite = null;   // réaction immédiate à l'écran
  sceneActive = null;
  if (enDemo()) { afficher(); return; }
  enAttente[id] = true; afficher();
  action('basculer', id);
});
$('scenes').addEventListener('click', function(e){
  var t = cible(e, 'scene'); if (!t) return;
  sceneActive = t.getAttribute('data-id'); afficher();
  if (!enDemo()) action('scene', sceneActive);
});

charger();
setInterval(function(){ if (!enDemo()) charger(); }, CONFIG.RAFRAICHIR_SEC * 1000);
</script>
</body>
</html>
